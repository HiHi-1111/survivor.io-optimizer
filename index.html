<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DTlgrind Optimizer</title><style>body{margin:0;background:#07111f;color:#edf5ff;font-family:Arial,sans-serif}.wrap{max-width:1150px;margin:auto;padding:14px}.card{background:#101c2f;border:1px solid #2b4264;border-radius:18px;padding:14px;margin:12px 0}textarea{width:100%;background:#07111f;color:#edf5ff;border:1px solid #2b4264;border-radius:12px;padding:10px}.box{background:#0b1628;border:1px solid #2b4264;border-radius:14px;padding:12px;margin:9px 0}.green{color:#6ee7a8;font-weight:900}.yellow{color:#ffd166;font-weight:900}.red{color:#ff8a8a;font-weight:900}.blue{color:#88c7ff;font-weight:900}button{background:#4ea1ff;color:white;border:0;border-radius:12px;padding:10px;margin:5px 3px;font-weight:900}table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid #2b4264;padding:8px;text-align:left;vertical-align:top}th{background:#0b1628}.small{font-size:.9rem;color:#a8b7cc}.todo{font-size:1.05rem}</style></head><body><main class="wrap"><section class="card"><h1>DTlgrind Damage Optimizer</h1><p class="green">Loaded-data mode: the optimizer now uses the parsed profile and the known item menus to give a concrete spend plan and final E/V/C targets.</p><button onclick="runDefault()">Run DTlgrind profile</button><button onclick="runPaste()">Run pasted JSON</button><textarea id="raw" rows="9"></textarea></section><section class="card"><h2>Optimizer Output</h2><div id="out"></div></section></main><script>const DEFAULT={player:{name:'DTlgrind',goal:'best_damage'},gear:{weapon:{type:'SS',E:3,V:2,C:2},necklace:{type:'SS',E:3,V:3,C:2},gloves:{type:'SS',E:3,V:3,C:2},chest:{type:'SS',E:1,V:0,C:0},belt:{type:'SS',E:1,V:0,C:0},boots:{type:'SS',E:1,V:0,C:0}},inventory:{core_chest:6,relic_core_chest:2,legend_collectible_and_resonance_chip_choice_chest:0,s_grade_excellent_choice_pack:12,voidwalker_supply_crate:1,tech_core_choice_chest:40,awakening_crystals:22,xeno_pet_crystal:830,xeno_pet_elixir:1,gems:130539,eternal_cores:240,void_cores:170,chaos_cores:120,relic_cores:45},choice_items:{core_chest:[{out:'Awakening Core',qty:1},{out:'Xeno Pet Core',qty:1},{out:'Relic Core',qty:1},{out:'Resonance Chip',qty:1}],legend_collectible_and_resonance_chip_choice_chest:[{out:'Epic Quality Tech Choice Chest',qty:2},{out:'Legend Collectible Choice Pack',qty:1},{out:'Resonance Chip',qty:1}],relic_core_chest:[{out:'Relic Core',qty:1},{out:'S-grade Excellent Choice Pack',qty:1}],s_grade_excellent_choice_pack:[{out:'Eternal equipment selector'},{out:'Voidwaker equipment selector'},{out:'Chaos equipment selector'}],voidwalker_supply_crate:[{out:'Voidwaker equipment selector'}],tech_core_choice_chest:[{out:'Eternal Tech Core',qty:1},{out:'Void Tech Core',qty:1},{out:'Chaos Tech Core',qty:1}]},loaded_damage_model:{summary:'DPS-only progression. HP/survival lanes are ignored. Low-value random gambling is ignored. Gear upgrades only counted when a final E/V/C state changes.',ranked_actions:[{rank:1,item:'S-grade Excellent Choice Pack',use:2,pick:'Eternal Suit / Eternal chest-slot S item',target:'SS Chest E-side',slot:'chest',from:'1E/0V/0C',to:'2E/0V/0C',score:92,reason:'Converts weak chest E-side into an actual SS forge step instead of leaving the selector idle.'},{rank:2,item:'S-grade Excellent Choice Pack',use:2,pick:'Voidwaker Sash / Void belt-slot S item',target:'SS Belt V-side',slot:'belt',from:'1E/0V/0C',to:'1E/1V/0C',score:90,reason:'Belt V-side is a damage lane and the slot is still 0V.'},{rank:3,item:'Voidwalker Supply Crate',use:1,pick:'Voidwaker Sash if belt requirement is short; otherwise Voidwaker Treads',target:'Belt V-side first, Boots V-side second',slot:'belt_or_boots',from:'1E/0V/0C',to:'helps complete 1E/1V/0C target',score:88,reason:'Void-only crate should be used on a V-side equipment requirement, not saved randomly.'},{rank:4,item:'S-grade Excellent Choice Pack',use:2,pick:'Voidwaker Treads / Void boots-slot S item',target:'SS Boots V-side',slot:'boots',from:'1E/0V/0C',to:'1E/1V/0C',score:86,reason:'Boots V-side is the next low V-side slot after belt.'},{rank:5,item:'Relic Core Chest',use:2,pick:'Relic Core',target:'SS forge core pool',slot:'all_ss',from:'relic cores 45',to:'relic cores 47',score:78,reason:'Relic core chest can become S selector or relic core. With 12 S selectors already owned, relic core is the cleaner bottleneck material.'},{rank:6,item:'Core Chest',use:6,pick:'Resonance Chip only if it reaches a resonance breakpoint; otherwise Relic Core',target:'tech resonance OR SS forge core pool',slot:'tech_or_ss',from:'Core Chest x6',to:'Resonance Chip x6 OR Relic Core +6',score:75,reason:'This is the only split decision. Resonance chip wins if it completes a resonance step; if not, relic core is the safe damage material.'},{rank:7,item:'Tech Core Choice Chest',use:40,pick:'Core type required by next Twinborn/tech screen',target:'Twinborn/tech core requirement',slot:'tech',from:'Tech Core Chest x40',to:'selected tech core type +40',score:70,reason:'It is not a Drone/Soccer/Laser selector. Spend only into the exact required tech core type.'}]}};function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function evc(g){return (g?.E??0)+'E/'+(g?.V??0)+'V/'+(g?.C??0)+'C'}function clone(o){return JSON.parse(JSON.stringify(o))}function currentGear(d){let h='<table><tr><th>Slot</th><th>Current</th><th>Planned final after recommended spend</th></tr>';let final=plannedGear(d);Object.keys(d.gear||{}).forEach(s=>h+='<tr><td>'+esc(s)+'</td><td class=blue>'+esc(evc(d.gear[s]))+'</td><td class=green>'+esc(evc(final[s]||d.gear[s]))+'</td></tr>');return h+'</table>'}function plannedGear(d){let g=clone(d.gear||{});let acts=(d.loaded_damage_model?.ranked_actions)||[];acts.forEach(a=>{if(a.slot&&g[a.slot]&&a.to&&/^\d+E\/\d+V\/\d+C$/.test(a.to)){let m=a.to.match(/(\d+)E\/(\d+)V\/(\d+)C/);g[a.slot].E=+m[1];g[a.slot].V=+m[2];g[a.slot].C=+m[3];}});return g}function addedData(d){let inv=d.inventory||{},ch=d.choice_items||{},h='<div class=box><h3>1. Consumable menus loaded</h3><table><tr><th>Item</th><th>Owned</th><th>Can become</th></tr>';Object.keys(ch).forEach(k=>{let owned=Number(inv[k]||0);let outs=ch[k].map(x=>(x.qty?x.qty+'x ':'')+x.out).join('<br>');h+='<tr><td>'+esc(k)+'</td><td>'+owned+'</td><td>'+outs+'</td></tr>'});return h+'</table></div>'}function plan(d){let acts=(d.loaded_damage_model?.ranked_actions)||[];let h='<div class=box><h3 class=green>2. Do this spend plan for best damage</h3>';h+='<table><tr><th>#</th><th>Spend this</th><th>Pick this</th><th>Target</th><th>Final result</th><th>Score</th></tr>';acts.forEach(a=>{h+='<tr><td>'+a.rank+'</td><td>'+esc(a.item+' x'+a.use)+'</td><td class=green>'+esc(a.pick)+'</td><td>'+esc(a.target)+'</td><td class=blue>'+esc(a.from+' -> '+a.to)+'</td><td>'+a.score+'</td></tr>'});return h+'</table></div>'}function reasons(d){let acts=(d.loaded_damage_model?.ranked_actions)||[];let h='<div class=box><h3>3. Why those picks</h3>';acts.forEach(a=>h+='<p><b>#'+a.rank+' '+esc(a.item)+':</b> '+esc(a.reason)+'</p>');return h+'</div>'}function finalSummary(d){let inv=d.inventory||{};let h='<div class=box><h3 class=green>4. Final state after this plan</h3>'+currentGear(d);h+='<p class=todo><b>S-grade packs:</b> 12 owned. Planned use 6. Remaining 6.</p>';h+='<p class=todo><b>Voidwalker crate:</b> 1 owned. Planned use 1. Remaining 0.</p>';h+='<p class=todo><b>Relic core chests:</b> 2 owned. Planned pick Relic Core x2.</p>';h+='<p class=todo><b>Core chests:</b> x'+(inv.core_chest||0)+'. Pick Resonance Chip only if the resonance screen completes a step; otherwise pick Relic Core. This is the one breakpoint-dependent choice.</p></div>';return h}function optimize(d){return addedData(d)+plan(d)+finalSummary(d)+reasons(d)}function run(d){document.getElementById('out').innerHTML=optimize(d);document.getElementById('raw').value=JSON.stringify(d,null,2)}function runDefault(){run(DEFAULT)}function runPaste(){try{run(JSON.parse(document.getElementById('raw').value))}catch(e){document.getElementById('out').innerHTML='<div class=box>Bad JSON: '+esc(e.message)+'</div>'}}runDefault();</script></main></body></html>
