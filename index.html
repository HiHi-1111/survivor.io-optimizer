<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DTlgrind Optimizer</title><style>body{margin:0;background:#07111f;color:#edf5ff;font-family:Arial,sans-serif}.wrap{max-width:950px;margin:auto;padding:14px}.card{background:#101c2f;border:1px solid #2b4264;border-radius:18px;padding:14px;margin:12px 0}textarea,input{width:100%;background:#07111f;color:#edf5ff;border:1px solid #2b4264;border-radius:12px;padding:10px}.box{background:#0b1628;border:1px solid #2b4264;border-radius:14px;padding:12px;margin:9px 0}.best{color:#6ee7a8;font-weight:900}.warn{color:#ffd166}button{background:#4ea1ff;color:white;border:0;border-radius:12px;padding:10px;margin:5px 3px;font-weight:900}pre{white-space:pre-wrap}</style></head><body><main class="wrap"><section class="card"><h1>DTlgrind Damage Optimizer</h1><p>Uses parsed profile + consumable choice possibilities. It outputs exact spend targets for best damage from the data loaded.</p><button onclick="runDefault()">Run DTlgrind profile</button><button onclick="runPaste()">Run pasted JSON</button><textarea id="raw" rows="9"></textarea></section><section class="card"><h2>Optimizer Output</h2><div id="out"></div></section></main><script>const DEFAULT={player:{name:'DTlgrind',focus:'damage'},build:{gear:{weapon:'SS 3E/2V/2C',necklace:'SS 3E/3V/2C',gloves:'SS 3E/3V/2C',chest:'SS 1E/0V/0C',belt:'SS 1E/0V/0C',boots:'SS 1E/0V/0C'},tech:{drone:900,rocket:'900 x1.2',soccer:550,lightning:'960 x1.2',laser:'1260 x1.4',molotov:600},pet:{main:'Nutjob',sync:85,nutjobStars:4}},inventory:{core_chest:6,relic_core_chest:2,legend_collectible_and_resonance_chip_choice_chest:0,s_grade_excellent_choice_pack:12,voidwalker_supply_crate:1,tech_core_choice_chest:40,awakening_crystals:22,xeno_pet_crystal:830,xeno_pet_elixir:1,gems:130539,eternal_cores:240,void_cores:170,chaos_cores:120,relic_cores:45},item_possibilities:{core_chest:['Awakening Core x1','Xeno Pet Core x1','Relic Core x1','Resonance Chip x1'],legend_collectible_and_resonance_chip_choice_chest:['Epic Quality Tech Choice Chest x2','Legend Collectible Choice Pack x1','Resonance Chip x1'],relic_core_chest:['Relic Core x1','S-grade Excellent Choice Pack x1'],s_grade_excellent_choice_pack:['Eternal equipment any slot','Voidwaker equipment any slot','Chaos equipment any slot'],voidwalker_supply_crate:['Voidwaker equipment any slot'],tech_core_choice_chest:['Eternal Tech Core x1','Void Tech Core x1','Chaos Tech Core x1']}};function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function n(v){return Number(v||0)}function box(title,before,possible,best,after,why){return `<div class=box><h3>${esc(title)}</h3><p><b>BEFORE:</b> ${esc(before)}</p><p><b>POSSIBLE:</b> ${esc(possible)}</p><p class=best><b>BEST DAMAGE PICK:</b> ${esc(best)}</p><p><b>AFTER:</b> ${esc(after)}</p><p class=warn><b>Reason:</b> ${esc(why)}</p></div>`}function optimize(d){let inv=d.inventory||{}, gear=(d.build&&d.build.gear)||{}, out=[];let core=n(inv.core_chest);if(core>0)out.push(box('Core Chest x'+core,'Owned '+core+'. It can become 4 different high-value items.',(d.item_possibilities?.core_chest||[]).join(' / '),'Pick Relic Core x'+core,'Relic cores +'+core+'. Core Chest left 0.','For best damage with SS gear already built, relic cores are the cleanest direct SS damage progression material unless a screenshot proves resonance chip reaches an immediate breakpoint.'));let rc=n(inv.relic_core_chest);if(rc>0)out.push(box('Relic Core Chest x'+rc,'Owned '+rc+'.', (d.item_possibilities?.relic_core_chest||[]).join(' / '),'Pick Relic Core x'+rc,'Relic cores +'+rc+'. Relic Core Chest left 0.','Between Relic Core and S-grade pack, Relic Core is the direct SS upgrade bottleneck for damage.'));let lcr=n(inv.legend_collectible_and_resonance_chip_choice_chest);if(lcr>0)out.push(box('Legend Collectible + Resonance Chip Choice Chest x'+lcr,'Owned '+lcr+'.',(d.item_possibilities?.legend_collectible_and_resonance_chip_choice_chest||[]).join(' / '),'Pick Resonance Chip x'+lcr,'Resonance Chips +'+lcr+'.','For damage, resonance chip beats random collectible unless the collectible completes a known set bonus in the JSON.'));let sg=n(inv.s_grade_excellent_choice_pack);if(sg>0)out.push(box('S-grade Excellent Choice Pack x'+sg,'Owned '+sg+'. Weak SS slots from parsed gear: chest/belt/boots are 1E/0V/0C.',(d.item_possibilities?.s_grade_excellent_choice_pack||[]).join(' / '),'Use only exact fodder: Voidwaker Sash/Treads for V-side or Eternal Suit for E-side. Do not open all blindly.','Hold packs until forge screen shows required slot/family; then spend exact amount only.','S packs are not one material. They are slot/family selectors, so the best damage pick depends on the next SS forge requirement.'));let vc=n(inv.voidwalker_supply_crate);if(vc>0)out.push(box('Voidwalker Supply Crate x'+vc,'Owned '+vc+'.',(d.item_possibilities?.voidwalker_supply_crate||[]).join(' / '),'Pick Voidwaker Sash if belt V-side needs fodder; otherwise Voidwaker Treads if boots V-side needs fodder.','Void crate left 0 only after confirmed V-side fodder need.','Voidwalker crate can only solve Voidwaker equipment needs, so it should go to the first confirmed V-side forge requirement.'));let tc=n(inv.tech_core_choice_chest);if(tc>0)out.push(box('Tech Core Choice Chest x'+tc,'Owned '+tc+'.',(d.item_possibilities?.tech_core_choice_chest||[]).join(' / '),'Pick the tech core type required by the next Twinborn/tech upgrade screen. If no screen: do not open.','No change until exact tech core type is known.','It gives tech core type, not a direct Drone/Soccer/Laser item. Best damage depends on the exact tech upgrade requirement.'));let xp=n(inv.xeno_pet_crystal);if(xp>0)out.push(box('Xeno Pet Crystal x'+xp,'Owned '+xp+'. Main pet in parsed build: '+(d.build?.pet?.main||'unknown'), 'Xeno pet star/awakening progress','Spend only if it completes the next star/breakpoint shown in-game.','If no breakpoint is confirmed, hold.','Damage gain depends on breakpoint, not partial spending. Need cost table/screenshot to guarantee exact spend.'));return out.join('')||'<div class=box>No spendable choice items found in inventory JSON.</div>'}function run(d){document.getElementById('out').innerHTML=optimize(d);document.getElementById('raw').value=JSON.stringify(d,null,2)}function runDefault(){run(DEFAULT)}function runPaste(){try{run(JSON.parse(document.getElementById('raw').value))}catch(e){document.getElementById('out').innerHTML='<div class=box>Bad JSON: '+esc(e.message)+'</div>'}}runDefault();</script></main></body></html>
