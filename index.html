<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DTlgrind Optimizer</title><style>body{margin:0;background:#07111f;color:#edf5ff;font-family:Arial,sans-serif}.wrap{max-width:1150px;margin:auto;padding:14px}.card{background:#101c2f;border:1px solid #2b4264;border-radius:18px;padding:14px;margin:12px 0}textarea{width:100%;background:#07111f;color:#edf5ff;border:1px solid #2b4264;border-radius:12px;padding:10px}.box{background:#0b1628;border:1px solid #2b4264;border-radius:14px;padding:12px;margin:9px 0}.green{color:#6ee7a8;font-weight:900}.yellow{color:#ffd166;font-weight:900}.blue{color:#88c7ff;font-weight:900}.red{color:#ff8a8a;font-weight:900}button{background:#4ea1ff;color:white;border:0;border-radius:12px;padding:10px;margin:5px 3px;font-weight:900}table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid #2b4264;padding:8px;text-align:left;vertical-align:top}th{background:#0b1628}.pill{display:inline-block;background:#162a46;border:1px solid #4ea1ff;border-radius:999px;padding:7px 10px;margin:4px}.small{font-size:.9rem;color:#a8b7cc}</style></head><body><main class="wrap"><section class="card"><h1>DTlgrind Damage Optimizer</h1><p class="green">All-possibilities mode: it tests every Core Chest + Relic Core Chest conversion, then picks the highest scoring combined damage plan. Relic cores already used in your build are not counted as extra.</p><button onclick="runDefault()">Run DTlgrind profile</button><button onclick="runPaste()">Run pasted JSON</button><textarea id="raw" rows="10"></textarea></section><section class="card"><h2>Optimizer Output</h2><div id="out"></div></section></main><script>const DEFAULT={player:{name:'DTlgrind',goal:'best_damage'},gear:{weapon:{E:3,V:2,C:2},necklace:{E:3,V:3,C:2},gloves:{E:3,V:3,C:2},chest:{E:1,V:0,C:0},belt:{E:1,V:0,C:0},boots:{E:1,V:0,C:0}},tech:{drone:900,rocket:'900 x1.2',soccer:550,lightning:'960 x1.2',laser:'1260 x1.4',molotov:600},pet:{main:'Nutjob',stars:4,sync:85},inventory:{core_chest:6,relic_core_chest:2,s_grade_excellent_choice_pack:12,voidwalker_supply_crate:1,tech_core_choice_chest:40,xeno_pet_crystal:830,xeno_pet_elixir:1,relic_cores_total_in_build:45,relic_cores_extra_spendable:0,movable_awakening_cores:23},menus:{core_chest:['Awakening Core','Xeno Pet Core','Relic Core','Resonance Chip'],relic_core_chest:['Relic Core','S-grade Excellent Choice Pack']},score_model:{gear_targets:[{id:'belt +1V',slot:'belt',from:'1E/0V/0C',to:'1E/1V/0C',needs_relic:1,needs_items:{'Voidwaker belt-slot S item':2},score:120},{id:'boots +1V',slot:'boots',from:'1E/0V/0C',to:'1E/1V/0C',needs_relic:1,needs_items:{'Voidwaker boots-slot S item':2},score:100},{id:'chest +1E',slot:'chest',from:'1E/0V/0C',to:'2E/0V/0C',needs_relic:1,needs_items:{'Eternal chest-slot S item':2},score:80}],chip_each:40,chip_breakpoints:[{at:3,bonus:80},{at:6,bonus:40}],xeno_core_each_first_two:65,xeno_core_after_two:30,awakening_core_from_chest:0,notes:'23 movable awakening cores are already available, so buying more Awakening Core from Core Chest scores 0 unless your JSON changes this.'}};function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function evc(g){return (g?.E??0)+'E/'+(g?.V??0)+'V/'+(g?.C??0)+'C'}function clone(o){return JSON.parse(JSON.stringify(o))}function add(m,k,q){m[k]=(m[k]||0)+Number(q||0)}function chipScore(n,sm){let s=n*(sm.chip_each||0);(sm.chip_breakpoints||[]).forEach(b=>{if(n>=b.at)s+=b.bonus});return s}function xenoScore(n,sm){return Math.min(n,2)*(sm.xeno_core_each_first_two||0)+Math.max(0,n-2)*(sm.xeno_core_after_two||0)}function applyGear(d,extraRelics,sPackBonus){let inv=d.inventory, sm=d.score_model, sPacks=(inv.s_grade_excellent_choice_pack||0)+sPackBonus, voidCrate=inv.voidwalker_supply_crate||0, relic=extraRelics, chosen=[], totals={}, score=0;let targets=[...sm.gear_targets].sort((a,b)=>b.score-a.score);for(const t of targets){if(relic<t.needs_relic)continue;let need=clone(t.needs_items), totalItems=Object.values(need).reduce((a,b)=>a+b,0);let sNeed=totalItems;if(voidCrate>0){let voidKey=Object.keys(need).find(k=>k.includes('Voidwaker'));if(voidKey){need[voidKey]--;voidCrate--;sNeed--;}}if(sPacks<sNeed)continue;sPacks-=sNeed;relic-=t.needs_relic;score+=t.score;chosen.push(t);Object.keys(t.needs_items).forEach(k=>add(totals,k,t.needs_items[k]));}return {score,chosen,totals,remaining_s_packs:sPacks,remaining_void_crate:voidCrate,remaining_extra_relics:relic}}function evalPlan(d,c){let sm=d.score_model;let gear=applyGear(d,c.relic+c.relicChestRelic,c.sPackFromRelicChest);let score=gear.score+chipScore(c.chip,sm)+xenoScore(c.xeno,sm)+c.awakening*(sm.awakening_core_from_chest||0);let totals=clone(gear.totals);if(c.chip)add(totals,'Resonance Chip',c.chip);if(c.xeno)add(totals,'Xeno Pet Core',c.xeno);if(c.awakening)add(totals,'Awakening Core',c.awakening);if(c.relicChestRelic)add(totals,'Relic Core from Relic Core Chest',c.relicChestRelic);if(c.sPackFromRelicChest)add(totals,'S-grade Excellent Choice Pack from Relic Core Chest',c.sPackFromRelicChest);if(d.inventory.tech_core_choice_chest)add(totals,'Selected Tech Core Type',d.inventory.tech_core_choice_chest);return {...c,score,gear,totals}}function enumerate(d){let core=d.inventory.core_chest||0, rch=d.inventory.relic_core_chest||0, res=[];for(let a=0;a<=core;a++)for(let x=0;x<=core-a;x++)for(let r=0;r<=core-a-x;r++){let chip=core-a-x-r;for(let rr=0;rr<=rch;rr++){res.push(evalPlan(d,{awakening:a,xeno:x,relic:r,chip,relicChestRelic:rr,sPackFromRelicChest:rch-rr}))}}res.sort((p,q)=>q.score-p.score);return res}function pills(map){let h='';Object.keys(map).forEach(k=>h+='<div class=pill>'+esc(k)+' x'+map[k]+'</div>');return h}function top(d,b,all){return '<div class=box><h3 class=green>BEST TOTAL END ITEMS TO GET</h3><p>Tested '+all.length+' possible conversion plans. Highest score: <b>'+b.score+'</b>.</p>'+pills(b.totals)+'<p class=yellow>Important correction loaded: 45 relic cores are already inside your build, so spendable extra relic cores start at '+(d.inventory.relic_cores_extra_spendable||0)+'. Movable Awakening Cores: '+(d.inventory.movable_awakening_cores||0)+'.</p></div>'}function chestPlan(b){return '<div class=box><h3>Open choice chests like this</h3><table><tr><th>Chest/item</th><th>Pick</th></tr><tr><td>Core Chest x6</td><td>Resonance Chip x'+b.chip+'<br>Xeno Pet Core x'+b.xeno+'<br>Relic Core x'+b.relic+'<br>Awakening Core x'+b.awakening+'</td></tr><tr><td>Relic Core Chest x2</td><td>Relic Core x'+b.relicChestRelic+'<br>S-grade Excellent Choice Pack x'+b.sPackFromRelicChest+'</td></tr><tr><td>Tech Core Choice Chest x40</td><td>Selected Tech Core Type x40</td></tr></table></div>'}function gearResult(d,b){let g=clone(d.gear), h='<div class=box><h3>Final equipment E/V/C from chosen gear upgrades</h3><table><tr><th>Slot</th><th>Before</th><th>After</th></tr>';b.gear.chosen.forEach(t=>{let m=t.to.match(/(\d+)E\/(\d+)V\/(\d+)C/);if(g[t.slot]){g[t.slot].E=+m[1];g[t.slot].V=+m[2];g[t.slot].C=+m[3];}});Object.keys(d.gear).forEach(s=>h+='<tr><td>'+esc(s)+'</td><td>'+esc(evc(d.gear[s]))+'</td><td class=green>'+esc(evc(g[s]))+'</td></tr>');return h+'</table></div>'}function detail(b){let h='<div class=box><h3>Gear upgrades selected by the winning plan</h3><table><tr><th>Upgrade</th><th>Uses end-items</th><th>E/V/C</th><th>Score</th></tr>';b.gear.chosen.forEach(t=>h+='<tr><td>'+esc(t.id)+'</td><td>'+esc(JSON.stringify(t.needs_items))+' + Relic Core x'+t.needs_relic+'</td><td>'+esc(t.from+' -> '+t.to)+'</td><td>'+t.score+'</td></tr>');return h+'</table></div>'}function top5(all){let h='<div class=box><h3>Top 5 tested possibilities</h3><table><tr><th>#</th><th>Score</th><th>Core Chest picks</th><th>Relic Chest picks</th></tr>';all.slice(0,5).forEach((p,i)=>h+='<tr><td>'+(i+1)+'</td><td>'+p.score+'</td><td>Chip '+p.chip+', Xeno '+p.xeno+', Relic '+p.relic+', Awakening '+p.awakening+'</td><td>Relic '+p.relicChestRelic+', S-pack '+p.sPackFromRelicChest+'</td></tr>');return h+'</table></div>'}function model(d){let sm=d.score_model;let h='<div class=box><h3>Scoring table used</h3><p class=small>'+esc(sm.notes)+'</p><table><tr><th>Thing</th><th>Score</th></tr>';sm.gear_targets.forEach(t=>h+='<tr><td>'+esc(t.id)+'</td><td>'+t.score+'</td></tr>');h+='<tr><td>Resonance Chip each + breakpoints</td><td>'+sm.chip_each+' each; '+JSON.stringify(sm.chip_breakpoints)+'</td></tr><tr><td>Xeno Pet Core</td><td>'+sm.xeno_core_each_first_two+' each for first 2, then '+sm.xeno_core_after_two+'</td></tr><tr><td>Awakening Core from Core Chest</td><td>'+sm.awakening_core_from_chest+'</td></tr></table></div>';return h}function optimize(d){let all=enumerate(d), b=all[0];return top(d,b,all)+chestPlan(b)+gearResult(d,b)+detail(b)+top5(all)+model(d)}function run(d){document.getElementById('out').innerHTML=optimize(d);document.getElementById('raw').value=JSON.stringify(d,null,2)}function runDefault(){run(DEFAULT)}function runPaste(){try{run(JSON.parse(document.getElementById('raw').value))}catch(e){document.getElementById('out').innerHTML='<div class=box>Bad JSON: '+esc(e.message)+'</div>'}}runDefault();</script></main></body></html>
