<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DTlgrind Optimizer</title><style>body{margin:0;background:#07111f;color:#edf5ff;font-family:Arial,sans-serif}.wrap{max-width:1150px;margin:auto;padding:14px}.card{background:#101c2f;border:1px solid #2b4264;border-radius:18px;padding:14px;margin:12px 0}textarea{width:100%;background:#07111f;color:#edf5ff;border:1px solid #2b4264;border-radius:12px;padding:10px}.box{background:#0b1628;border:1px solid #2b4264;border-radius:14px;padding:12px;margin:9px 0}.green{color:#6ee7a8;font-weight:900}.yellow{color:#ffd166;font-weight:900}.blue{color:#88c7ff;font-weight:900}button{background:#4ea1ff;color:white;border:0;border-radius:12px;padding:10px;margin:5px 3px;font-weight:900}table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid #2b4264;padding:8px;text-align:left;vertical-align:top}th{background:#0b1628}.big{font-size:1.08rem;line-height:1.45}.pill{display:inline-block;background:#162a46;border:1px solid #4ea1ff;border-radius:999px;padding:7px 10px;margin:4px}</style></head><body><main class="wrap"><section class="card"><h1>DTlgrind Damage Optimizer</h1><p class="green">Plain output mode: first shows exactly what to buy/pick in total, then shows where each item came from.</p><button onclick="runDefault()">Run DTlgrind profile</button><button onclick="runPaste()">Run pasted JSON</button><textarea id="raw" rows="9"></textarea></section><section class="card"><h2>Optimizer Output</h2><div id="out"></div></section></main><script>const DEFAULT={player:{name:'DTlgrind',goal:'best_damage'},gear:{weapon:{type:'SS',E:3,V:2,C:2},necklace:{type:'SS',E:3,V:3,C:2},gloves:{type:'SS',E:3,V:3,C:2},chest:{type:'SS',E:1,V:0,C:0},belt:{type:'SS',E:1,V:0,C:0},boots:{type:'SS',E:1,V:0,C:0}},inventory:{core_chest:6,relic_core_chest:2,legend_collectible_and_resonance_chip_choice_chest:0,s_grade_excellent_choice_pack:12,voidwalker_supply_crate:1,tech_core_choice_chest:40,awakening_crystals:22,xeno_pet_crystal:830,xeno_pet_elixir:1,gems:130539,eternal_cores:240,void_cores:170,chaos_cores:120,relic_cores:45},choice_items:{core_chest:[{out:'Awakening Core',qty:1},{out:'Xeno Pet Core',qty:1},{out:'Relic Core',qty:1},{out:'Resonance Chip',qty:1}],legend_collectible_and_resonance_chip_choice_chest:[{out:'Epic Quality Tech Choice Chest',qty:2},{out:'Legend Collectible Choice Pack',qty:1},{out:'Resonance Chip',qty:1}],relic_core_chest:[{out:'Relic Core',qty:1},{out:'S-grade Excellent Choice Pack',qty:1}],s_grade_excellent_choice_pack:[{out:'Eternal equipment selector'},{out:'Voidwaker equipment selector'},{out:'Chaos equipment selector'}],voidwalker_supply_crate:[{out:'Voidwaker equipment selector'}],tech_core_choice_chest:[{out:'Eternal Tech Core',qty:1},{out:'Void Tech Core',qty:1},{out:'Chaos Tech Core',qty:1}]},spend_plan:[{from:'S-grade Excellent Choice Pack',use:2,pick:'Eternal Suit / Eternal chest-slot S item',end_item:'Eternal chest-slot S item',qty:2,slot:'chest',evc_from:'1E/0V/0C',evc_to:'2E/0V/0C'},{from:'S-grade Excellent Choice Pack',use:2,pick:'Voidwaker Sash / Void belt-slot S item',end_item:'Voidwaker belt-slot S item',qty:2,slot:'belt',evc_from:'1E/0V/0C',evc_to:'1E/1V/0C'},{from:'Voidwalker Supply Crate',use:1,pick:'Voidwaker Sash if belt still needs it, otherwise Voidwaker Treads',end_item:'Voidwaker belt/boots S item',qty:1,slot:'belt_or_boots',evc_from:'1E/0V/0C',evc_to:'helps finish 1E/1V/0C'},{from:'S-grade Excellent Choice Pack',use:2,pick:'Voidwaker Treads / Void boots-slot S item',end_item:'Voidwaker boots-slot S item',qty:2,slot:'boots',evc_from:'1E/0V/0C',evc_to:'1E/1V/0C'},{from:'Relic Core Chest',use:2,pick:'Relic Core',end_item:'Relic Core',qty:2,slot:'ss_core_pool',evc_from:'45 relic cores',evc_to:'47 relic cores'},{from:'Core Chest',use:6,pick:'Resonance Chip if resonance breakpoint; otherwise Relic Core',end_item:'Resonance Chip OR Relic Core',qty:6,slot:'breakpoint_choice',evc_from:'Core Chest x6',evc_to:'6 chips OR 6 relic cores'},{from:'Tech Core Choice Chest',use:40,pick:'needed Eternal/Void/Chaos Tech Core type from next tech screen',end_item:'Selected Tech Core Type',qty:40,slot:'tech',evc_from:'Tech Core Chest x40',evc_to:'selected tech core +40'}]};function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function evc(g){return (g?.E??0)+'E/'+(g?.V??0)+'V/'+(g?.C??0)+'C'}function clone(o){return JSON.parse(JSON.stringify(o))}function add(map,k,q){if(!k)return;map[k]=(map[k]||0)+Number(q||1)}function totals(d){let map={};(d.spend_plan||[]).forEach(x=>add(map,x.end_item,x.qty));return map}function totalList(d){let map=totals(d), h='<div class=box><h3 class=green>BUY / PICK THESE END ITEMS</h3><div class=big>';Object.keys(map).forEach(k=>h+='<div class=pill>'+esc(k)+' x'+map[k]+'</div>');h+='</div><p class=yellow>These are the final things the plan says to turn your choice items into.</p></div>';return h}function sourceTable(d){let h='<div class=box><h3>Where each end item comes from</h3><table><tr><th>Use this item</th><th>Amount</th><th>Pick this</th><th>End item gained</th><th>Gear result</th></tr>';(d.spend_plan||[]).forEach(x=>h+='<tr><td>'+esc(x.from)+'</td><td>'+esc(x.use)+'</td><td class=green>'+esc(x.pick)+'</td><td class=blue>'+esc(x.end_item+' x'+x.qty)+'</td><td>'+esc((x.evc_from||'')+' -> '+(x.evc_to||''))+'</td></tr>');return h+'</table></div>'}function plannedGear(d){let g=clone(d.gear||{});(d.spend_plan||[]).forEach(a=>{if(a.slot&&g[a.slot]&&/^\d+E\/\d+V\/\d+C$/.test(a.evc_to||'')){let m=a.evc_to.match(/(\d+)E\/(\d+)V\/(\d+)C/);g[a.slot].E=+m[1];g[a.slot].V=+m[2];g[a.slot].C=+m[3];}});return g}function finalGear(d){let f=plannedGear(d),h='<div class=box><h3>Final equipment E/V/C after plan</h3><table><tr><th>Slot</th><th>Before</th><th>After</th></tr>';Object.keys(d.gear||{}).forEach(s=>h+='<tr><td>'+esc(s)+'</td><td>'+esc(evc(d.gear[s]))+'</td><td class=green>'+esc(evc(f[s]))+'</td></tr>');return h+'</table></div>'}function remaining(d){let inv=clone(d.inventory||{});(d.spend_plan||[]).forEach(x=>{let key=x.from.toLowerCase().replaceAll(' ','_').replaceAll('-','_');if(inv[key]!=null)inv[key]-=Number(x.use||0)});let h='<div class=box><h3>Remaining major choice items</h3><table><tr><th>Item</th><th>Remaining</th></tr>';['s_grade_excellent_choice_pack','voidwalker_supply_crate','relic_core_chest','core_chest','tech_core_choice_chest'].forEach(k=>h+='<tr><td>'+esc(k)+'</td><td>'+esc(inv[k]??0)+'</td></tr>');return h+'</table></div>'}function optimize(d){return totalList(d)+sourceTable(d)+finalGear(d)+remaining(d)}function run(d){document.getElementById('out').innerHTML=optimize(d);document.getElementById('raw').value=JSON.stringify(d,null,2)}function runDefault(){run(DEFAULT)}function runPaste(){try{run(JSON.parse(document.getElementById('raw').value))}catch(e){document.getElementById('out').innerHTML='<div class=box>Bad JSON: '+esc(e.message)+'</div>'}}runDefault();</script></main></body></html>
