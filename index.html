<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DTlgrind Optimizer</title><style>body{margin:0;background:#07111f;color:#edf5ff;font-family:system-ui,Arial}.wrap{max-width:850px;margin:auto;padding:12px}.card{background:#101c2f;border:1px solid #2b4264;border-radius:18px;padding:14px;margin:12px 0}input,textarea{width:100%;background:#07111f;color:#edf5ff;border:1px solid #2b4264;border-radius:14px;padding:12px}button{border:0;border-radius:14px;padding:12px;margin:6px;background:#4ea1ff;color:white;font-weight:900}.box{background:#0b1628;border:1px solid #2b4264;border-radius:14px;padding:12px;margin:8px 0}.before{color:#ffd166}.after{color:#6ee7a8}.spend{color:#6ee7a8;font-weight:900}.small{color:#a8b7cc}</style></head><body><main class="wrap"><section class="card"><h1>DTlgrind Before / After Optimizer</h1><p>Ask what you can spend. It answers with BEFORE, SPEND, AFTER.</p><input id="q" placeholder="ask here"><button onclick="run()">Ask</button><button onclick="preset('s')">S chests</button><button onclick="preset('core')">Core chests</button><button onclick="preset('xeno')">Xeno</button><button onclick="preset('full')">Full</button></section><section class="card"><h2>Answer</h2><div id="answer"></div></section><section class="card"><h2>Data</h2><textarea id="raw" rows="8"></textarea></section></main><script>const P={rows:[['S chests','BEFORE: S-grade choice packs x12. Chest/Belt/Boots are 1E/0V/0C.','SPEND: x2 to Eternal chest item for SS Chest E-side. x2 to Void belt item for SS Belt V-side. x2 to Void boots item for SS Boots V-side.','AFTER: S packs left x6. Chest gets E progress. Belt and Boots get V progress.'],['Void crate','BEFORE: Void crate x1. Belt and Boots have 0V.','SPEND: x1 to Void belt item first. If not available, Void boots item.','AFTER: Void crate x0. Belt first, Boots second.'],['Core chests','BEFORE: Core choice chest x6. Cores are E240 V170 C120.','SPEND: x6 to Void cores.','AFTER: Core choice x0. Void cores +6 for Belt/Boots V-side.'],['Relic chests','BEFORE: Relic core chest x2 and relic cores x45.','SPEND: x2 to Relic cores.','AFTER: Relic chests x0. More relic cores for SS forge.'],['Tech core chests','BEFORE: Tech core choice chest x40.','SPEND: x40 to Void tech cores / Void-type core choice.','AFTER: Tech core chests x0. This is not Lightning/Soccer/Laser.'],['Xeno pet','BEFORE: Nutjob main 4 stars. Xeno crystal x830. Elixir x1. Awakening crystals x22.','SPEND: Xeno crystal x830 to Nutjob. Elixir x1 to Nutjob. Awakening only if next star finishes.','AFTER: Nutjob gets all Xeno progress. No spreading to 1-star pets.'],['Gems','BEFORE: Gems x130,539.','SPEND: only relic cores, selector cores, Xeno crystals, guaranteed S or SS selector value.','AFTER: Gems stay unless buying breakpoint material.']],save:['Save remaining S packs x6 unless exact SS fodder is needed','Save random pet chests','Save random equipment chests','Save awakening crystals if no star finishes']};function html(rows){return rows.map((r,i)=>'<div class=box><h3>#'+(i+1)+' '+r[0]+'</h3><div class=before>'+r[1]+'</div><div class=spend>'+r[2]+'</div><div class=after>'+r[3]+'</div></div>').join('')+'<div class=box><b>SAVE</b><br>- '+P.save.join('<br>- ')+'</div>'}function ans(q){q=(q||'').toLowerCase();let r=P.rows;if(q.includes('s chest')||q.includes('s-grade')||q==='s')r=P.rows.filter(x=>x[0]=='S chests');else if(q.includes('void crate'))r=P.rows.filter(x=>x[0]=='Void crate');else if(q.includes('core')&&!q.includes('tech')&&!q.includes('relic'))r=P.rows.filter(x=>x[0]=='Core chests');else if(q.includes('relic'))r=P.rows.filter(x=>x[0]=='Relic chests');else if(q.includes('tech'))r=P.rows.filter(x=>x[0]=='Tech core chests');else if(q.includes('xeno')||q.includes('pet'))r=P.rows.filter(x=>x[0]=='Xeno pet');else if(q.includes('gem'))r=P.rows.filter(x=>x[0]=='Gems');return html(r)}function run(){document.getElementById('answer').innerHTML=ans(document.getElementById('q').value)}function preset(x){document.getElementById('q').value=x;run()}document.getElementById('raw').value=JSON.stringify(P,null,2);run();</script></body></html>
