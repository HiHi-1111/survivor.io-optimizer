<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DTlgrind Optimizer</title><style>:root{color-scheme:dark;--bg:#07111f;--card:#101c2f;--card2:#17253b;--line:#2b4264;--txt:#edf5ff;--mut:#a8b7cc;--green:#6ee7a8;--yellow:#ffd166;--blue:#66aaff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17315a 0,#07111f 40rem);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:12px}h1{font-size:1.35rem;margin:4px 0}h2{font-size:1.05rem;margin:0 0 10px}.card{background:rgba(16,28,47,.96);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}.hero{border-color:#477cc0}.big{font-size:1.05rem;line-height:1.35}.mut{color:var(--mut)}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:7px 9px;color:#d9e8ff;font-size:.9rem}.plan{display:grid;gap:10px}.item{background:#0b1628;border:1px solid var(--line);border-radius:16px;padding:13px}.top{display:flex;gap:8px;align-items:center}.rank{color:var(--blue);font-weight:1000;font-size:1.15rem}.title{font-weight:1000;font-size:1.05rem}.tag{display:inline-block;margin:8px 0;padding:6px 9px;border-radius:999px;background:#6ee7a829;color:var(--green);border:1px solid #6ee7a859;font-weight:900;font-size:.82rem}.save{background:#ffd16624;color:var(--yellow);border-color:#ffd16655}.line{margin:5px 0}.k{color:var(--mut);font-weight:800}button{width:100%;border:0;border-radius:14px;padding:12px;margin-top:8px;font-weight:900;background:linear-gradient(135deg,#4ea1ff,#7c5cff);color:white}input,textarea{width:100%;border:1px solid var(--line);border-radius:14px;background:#07111f;color:var(--txt);padding:12px}.small{font-size:.86rem;color:var(--mut)}@media(max-width:520px){.wrap{padding:10px}.card{padding:12px}.big{font-size:1rem}}</style></head><body><main class="wrap"><section class="card hero"><h1>DTlgrind basic spend plan</h1><p id="answer" class="big"></p><button id="copy">Copy plan</button></section><section class="card"><h2>Inventory used</h2><div id="inv" class="chips"></div></section><section class="card"><h2>What to do</h2><div id="plan" class="plan"></div></section><section class="card"><h2>Upload different JSON</h2><input id="file" type="file" accept=".json,application/json"><p class="small">Optional. The page already has your current bag info built in.</p><textarea id="raw" rows="5"></textarea><button id="paste">Analyze pasted JSON</button></section></main><script>const BUILT={player:{name:'DTlgrind',level:138,total_atk:793156,final_atk:436568,focus:'DPS only'},inventory_used:{gems:130539,relic_core_chest:2,core_choice_chest:6,tech_core_choice_chest:40,s_grade_excellent_equipment_choice_pack:12,voidwalker_excellent_equipment_supply_crate:1,eternal_cores:20,chaos_cores:10,awakening_crystals:22},basic_answer:'Spend on SS forge first: Belt → Boots → Chest. Use core/relic selectors only when that forge step finishes. Then use tech cores on Lightning → Laser. Save S packs unless they finish SS forge.',spend_plan:[{rank:1,title:'SS Belt forge',use:'Relic chest x2 + Core choice x6',do:'Try Belt first. If upgrade finishes, spend.',save:'If Belt does not finish, check Boots.'},{rank:2,title:'SS Boots forge',use:'Same selectors',do:'Try only if Belt cannot finish.',save:'If Boots does not finish, check Chest.'},{rank:3,title:'SS Chest forge',use:'Same selectors',do:'Try only if Belt/Boots cannot finish.',save:'If Chest does not finish, keep selectors closed.'},{rank:4,title:'Tech cores',use:'Tech core choice x40',do:'Lightning first, then Laser.',save:'Do not put these into Soccer.'},{rank:5,title:'S packs / Void crate',use:'S choice x12 + Void crate x1',do:'Open only to finish SS forge.',save:'Do not open randomly.'},{rank:6,title:'Awakening crystals',use:'Awakening crystals x22',do:'Use only if Nutjob/Xeno star finishes now.',save:'If not enough, save.'},{rank:7,title:'Gems',use:'Gems x130,539',do:'Buy relic cores, tech selectors, Xeno crystals, guaranteed S/SS.',save:'Skip random pet/equipment chests.'}]};const $=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString();function render(p){p.spend_plan=p.spend_plan||p.direct_spend_plan||BUILT.spend_plan;const inv=p.inventory_used||p.resources||BUILT.inventory_used;$('answer').textContent=p.basic_answer||p.quick_answer||BUILT.basic_answer;$('raw').value=JSON.stringify(p,null,2);$('inv').innerHTML=Object.entries(inv).map(([k,v])=>`<span class="chip">${k.replaceAll('_',' ')}: <b>${typeof v==='number'?fmt(v):v}</b></span>`).join('');$('plan').innerHTML=p.spend_plan.sort((a,b)=>a.rank-b.rank).map(x=>`<article class="item"><div class="top"><span class="rank">#${x.rank}</span><span class="title">${x.title}</span></div><span class="tag">${x.use||''}</span><div class="line"><span class="k">Do:</span> ${x.do||x.target||''}</div><div class="line"><span class="k">Save:</span> ${x.save||x.stop_condition||''}</div></article>`).join('')}document.getElementById('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{render(JSON.parse(await f.text()))}catch(err){alert('Bad JSON')}});$('paste').onclick=()=>{try{render(JSON.parse($('raw').value))}catch(err){alert('Bad JSON')}};$('copy').onclick=async()=>{const t=BUILT.spend_plan.map(x=>`#${x.rank} ${x.title}: ${x.do} Save: ${x.save}`).join('\n');try{await navigator.clipboard.writeText(t);alert('Copied')}catch(e){alert(t)}};render(BUILT);</script></body></html>
