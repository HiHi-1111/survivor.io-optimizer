<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Damage Optimizer</title><style>body{margin:0;background:#07111f;color:#edf5ff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:14px}.card{background:#101c2f;border:1px solid #2b4264;border-radius:18px;padding:14px;margin:12px 0}textarea,input,select{width:100%;background:#07111f;color:#edf5ff;border:1px solid #2b4264;border-radius:12px;padding:10px}.box{background:#0b1628;border:1px solid #2b4264;border-radius:14px;padding:12px;margin:9px 0}.good{color:#6ee7a8;font-weight:900}.warn{color:#ffd166}.bad{color:#ff8a8a}button{background:#4ea1ff;color:white;border:0;border-radius:12px;padding:10px;margin:5px 3px;font-weight:900}table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid #2b4264;padding:8px;text-align:left}th{background:#0b1628}pre{white-space:pre-wrap}</style></head><body><main class="wrap"><section class="card"><h1>Damage Optimizer</h1><p>This version does not force chest/belt/boots or relic cores. It parses the profile, lists valid choices, shows candidate final E/V/C, and only calls a best pick when the JSON has damage score + cost data.</p><button onclick="runDefault()">Run DTlgrind parsed profile</button><button onclick="runPaste()">Run pasted JSON</button><textarea id="raw" rows="11"></textarea></section><section class="card"><h2>Output</h2><div id="out"></div></section></main><script>const DEFAULT={player:{name:'DTlgrind',goal:'best_damage'},gear:{weapon:{type:'SS',E:3,V:2,C:2},necklace:{type:'SS',E:3,V:3,C:2},gloves:{type:'SS',E:3,V:3,C:2},chest:{type:'SS',E:1,V:0,C:0},belt:{type:'SS',E:1,V:0,C:0},boots:{type:'SS',E:1,V:0,C:0}},inventory:{core_chest:6,relic_core_chest:2,legend_collectible_and_resonance_chip_choice_chest:0,s_grade_excellent_choice_pack:12,voidwalker_supply_crate:1,tech_core_choice_chest:40,awakening_crystals:22,xeno_pet_crystal:830,xeno_pet_elixir:1,gems:130539,eternal_cores:240,void_cores:170,chaos_cores:120,relic_cores:45},choice_items:{core_chest:[{out:'Awakening Core',qty:1},{out:'Xeno Pet Core',qty:1},{out:'Relic Core',qty:1},{out:'Resonance Chip',qty:1}],legend_collectible_and_resonance_chip_choice_chest:[{out:'Epic Quality Tech Choice Chest',qty:2},{out:'Legend Collectible Choice Pack',qty:1},{out:'Resonance Chip',qty:1}],relic_core_chest:[{out:'Relic Core',qty:1},{out:'S-grade Excellent Choice Pack',qty:1}],s_grade_excellent_choice_pack:[{out:'Eternal equipment selector',families:['Eternal'],slots:['weapon','necklace','gloves','chest','belt','boots']},{out:'Voidwaker equipment selector',families:['Voidwaker'],slots:['weapon','necklace','gloves','chest','belt','boots']},{out:'Chaos equipment selector',families:['Chaos'],slots:['weapon','necklace','gloves','chest','belt','boots']}],voidwalker_supply_crate:[{out:'Voidwaker equipment selector',families:['Voidwaker'],slots:['weapon','necklace','gloves','chest','belt','boots']}],tech_core_choice_chest:[{out:'Eternal Tech Core',qty:1},{out:'Void Tech Core',qty:1},{out:'Chaos Tech Core',qty:1}]},upgrade_candidates:[]};function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function evc(g){return (g?.E??0)+'E/'+(g?.V??0)+'V/'+(g?.C??0)+'C'}function clone(o){return JSON.parse(JSON.stringify(o))}function gearTable(gear){let h='<table><tr><th>Slot</th><th>Current E/V/C</th></tr>';Object.keys(gear||{}).forEach(s=>h+='<tr><td>'+esc(s)+'</td><td>'+esc(evc(gear[s]))+'</td></tr>');return h+'</table>'}function choices(d){let inv=d.inventory||{}, ch=d.choice_items||{}, h='';Object.keys(ch).forEach(k=>{let owned=Number(inv[k]||0);if(!owned)return;h+='<div class=box><h3>'+esc(k)+' x'+owned+'</h3><b>Possible outputs:</b><ul>';ch[k].forEach(x=>h+='<li>'+esc((x.qty?x.qty+'x ':'')+(x.out||JSON.stringify(x)))+'</li>');h+='</ul></div>'});return h||'<div class=box>No owned choice consumables found.</div>'}function generateNeutralCandidates(d){let gear=d.gear||{}, arr=[];Object.keys(gear).forEach(slot=>['E','V','C'].forEach(side=>{let g=gear[slot], nxt=clone(g);nxt[side]=(Number(nxt[side]||0)+1);arr.push({id:slot+'_'+side+'_plus1',slot,side,from:evc(g),to:evc(nxt),damage_score:null,requirements:'needs_cost_table'});}));return arr}function applyFinal(gear,c){let g=clone(gear);if(c.slot&&g[c.slot]&&c.side){g[c.slot][c.side]=Number(g[c.slot][c.side]||0)+Number(c.levels||1)}else if(c.final_gear){Object.keys(c.final_gear).forEach(s=>g[s]=c.final_gear[s])}return g}function candidates(d){let arr=(d.upgrade_candidates&&d.upgrade_candidates.length)?d.upgrade_candidates:generateNeutralCandidates(d);let h='<table><tr><th>Candidate</th><th>From</th><th>Final E/V/C</th><th>Needs</th><th>Damage score</th><th>Status</th></tr>';arr.forEach(c=>{let final=applyFinal(d.gear||{},c);let st=(c.damage_score==null||c.requirements==='needs_cost_table')?'no best pick yet':'eligible';h+='<tr><td>'+esc(c.id||((c.slot||'slot')+' '+(c.side||'')))+'</td><td>'+esc(c.from||((c.slot&&d.gear?.[c.slot])?evc(d.gear[c.slot]):''))+'</td><td>'+esc(c.slot?evc(final[c.slot]):JSON.stringify(final))+'</td><td>'+esc(typeof c.requirements==='string'?c.requirements:JSON.stringify(c.requirements||{}))+'</td><td>'+esc(c.damage_score??'missing')+'</td><td class="'+(st==='eligible'?'good':'warn')+'">'+st+'</td></tr>'});h+='</table>';return h}function best(d){let arr=(d.upgrade_candidates||[]).filter(c=>c.damage_score!=null&&c.requirements&&c.requirements!=='needs_cost_table');if(!arr.length)return '<div class=box><h3>Best damage pick</h3><p class=warn>No unbiased best pick yet. The JSON needs upgrade_candidates with: slot, side/final_gear, requirements, and damage_score. Until then the optimizer can show final E/V/C candidates, but should not pretend one is best.</p></div>';arr.sort((a,b)=>Number(b.damage_score)-Number(a.damage_score));let c=arr[0], final=applyFinal(d.gear||{},c);return '<div class=box><h3>Best damage pick</h3><p class=good>'+esc(c.id||c.slot)+' </p><p><b>Final E/V/C:</b> '+esc(c.slot?evc(final[c.slot]):JSON.stringify(final))+'</p><p><b>Uses:</b> '+esc(JSON.stringify(c.requirements))+'</p><p><b>Damage score:</b> '+esc(c.damage_score)+'</p></div>'}function optimize(d){return '<div class=box><h3>Parsed current equipment</h3>'+gearTable(d.gear||{})+'</div><div class=box><h3>Owned choice items and valid outputs</h3>'+choices(d)+'</div><div class=box><h3>Candidate final E/V/C states</h3>'+candidates(d)+'</div>'+best(d)}function run(d){document.getElementById('out').innerHTML=optimize(d);document.getElementById('raw').value=JSON.stringify(d,null,2)}function runDefault(){run(DEFAULT)}function runPaste(){try{run(JSON.parse(document.getElementById('raw').value))}catch(e){document.getElementById('out').innerHTML='<div class=box>Bad JSON: '+esc(e.message)+'</div>'}}runDefault();</script></main></body></html>
