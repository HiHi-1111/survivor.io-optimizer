<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DTlgrind Ask Optimizer</title><style>:root{color-scheme:dark;--bg:#07111f;--card:#101c2f;--line:#2b4264;--txt:#edf5ff;--mut:#a8b7cc;--green:#6ee7a8;--yellow:#ffd166;--blue:#66aaff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17315a 0,#07111f 42rem);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:820px;margin:auto;padding:12px}h1{font-size:1.35rem;margin:6px 0 4px}h2{font-size:1.05rem;margin:0 0 10px}.card{background:rgba(16,28,47,.96);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}.big{font-size:1.02rem;line-height:1.35}.row{border:1px solid var(--line);background:#0b1628;border-radius:15px;padding:12px;margin:9px 0}.rank{color:var(--blue);font-weight:1000}.pick{font-weight:1000;color:var(--green);font-size:1.02rem}.mut{color:var(--mut);font-size:.9rem;margin-top:4px}.save .pick{color:var(--yellow)}button{border:0;border-radius:14px;padding:12px;margin-top:8px;font-weight:900;background:linear-gradient(135deg,#4ea1ff,#7c5cff);color:white}.btns{display:flex;gap:8px;flex-wrap:wrap}.btns button{flex:1;min-width:135px}textarea,input{width:100%;border:1px solid var(--line);border-radius:14px;background:#07111f;color:var(--txt);padding:12px}#answer{white-space:pre-wrap}.small{font-size:.86rem;color:var(--mut)}</style></head><body><main class="wrap"><section class="card"><h1>Ask DTlgrind Optimizer</h1><p class="big">Ask it like: “what should I spend S chests on?” or “what do I do with tech core chests?”</p><input id="q" placeholder="Ask the optimizer…"><button id="ask">Ask</button><div class="btns"><button data-q="What should I spend S chests on?">S chests</button><button data-q="What should I spend tech core chests on?">Tech cores</button><button data-q="What should I spend gems on?">Gems</button><button data-q="Full spend plan">Full plan</button></div></section><section class="card"><h2>Optimizer answer</h2><div id="answer" class="big"></div></section><section class="card"><h2>Exact plan data</h2><textarea id="raw" rows="8"></textarea></section></main><script>const PROFILE={build:{gear:{'SS Weapon':'3E/2V/2C','SS Necklace':'3E/3V/2C','SS Gloves':'3E/3V/2C','SS Chest':'1E/0V/0C','SS Belt':'1E/0V/0C','SS Boots':'1E/0V/0C'},pet:'Nutjob 4★ main',focus:'DPS only'},inventory:{s_grade_choice_pack:12,voidwalker_supply_crate:1,core_choice_chest:6,tech_core_choice_chest:40,relic_core_chest:2,eternal_cores:240,void_cores:170,chaos_cores:120,relic_cores:45,xeno_pet_crystal:830,xeno_pet_elixir:1,awakening_crystals:22,gems:130539},rules:['Answer with exact item -> exact pick -> exact place.','Spend aggressively when it gives DPS progress.','Gems are not the main factor.','Do not treat tech core chests as Lightning/Soccer/Laser unless a real cost table says so.'],exact_spend_targets:[{rank:1,item:'S-grade excellent equipment choice pack',amount:2,pick:'Eternal Suit / Eternal chest piece',put_into:'SS Chest E-side progress'},{rank:2,item:'S-grade excellent equipment choice pack',amount:2,pick:'Voidwaker Sash / Void belt piece',put_into:'SS Belt V-side progress'},{rank:3,item:'S-grade excellent equipment choice pack',amount:2,pick:'Voidwaker Treads / Void boots piece',put_into:'SS Boots V-side progress'},{rank:4,item:'Voidwalker excellent equipment supply crate',amount:1,pick:'Voidwaker Sash if available; otherwise Voidwaker Treads',put_into:'SS Belt first, SS Boots second'},{rank:5,item:'Core choice chest',amount:6,pick:'Void cores',put_into:'SS Belt/Boots V-side core needs'},{rank:6,item:'Relic core chest',amount:2,pick:'Relic cores',put_into:'next SS forge step'},{rank:7,item:'Tech core choice chest',amount:40,pick:'Void tech cores / Void-type core choice',put_into:'Twinborn/tech core requirement, not Lightning/Soccer/Laser'},{rank:8,item:'Xeno pet crystal',amount:830,pick:'Nutjob',put_into:'Nutjob only'},{rank:9,item:'Xeno pet elixir',amount:1,pick:'Nutjob',put_into:'Nutjob only'},{rank:10,item:'Awakening crystals',amount:22,pick:'Nutjob/Xeno only if next star completes',put_into:'save if no star completes'}],save_targets:['Remaining S-grade packs after the listed picks','Gems unless buying relic cores / selector cores / Xeno crystals / guaranteed S or SS selector value','Random pet chests','Random equipment chests']};const $=id=>document.getElementById(id);function fullPlan(){return PROFILE.exact_spend_targets.map(x=>`#${x.rank}. ${x.item} x${x.amount}\nPick: ${x.pick}\nPut into: ${x.put_into}`).join('\n\n')+'\n\nSAVE:\n- '+PROFILE.save_targets.join('\n- ')}function answer(q){q=(q||'').toLowerCase();if(!q.trim())return 'Ask something first.';if(q.includes('s chest')||q.includes('s-grade')||q.includes('s grade')||q.includes('choice pack'))return 'Spend S-grade choice packs like this:\n\n1. x2 -> Eternal Suit / Eternal chest piece -> SS Chest E-side\n2. x2 -> Voidwaker Sash -> SS Belt V-side\n3. x2 -> Voidwaker Treads -> SS Boots V-side\n\nSave the rest unless the optimizer needs exact fodder for SS forge.';if(q.includes('tech core'))return 'Spend Tech Core Choice Chest x40 -> Void tech cores / Void-type core choice.\n\nDo NOT pick Lightning/Soccer/Laser from this. It is core-type value, not a skill pick.';if(q.includes('core choice')||q.includes('core chest'))return 'Spend Core Choice Chest x6 -> Void cores.\n\nPut them into SS Belt/Boots V-side core needs.';if(q.includes('relic'))return 'Spend Relic Core Chest x2 -> Relic cores.\n\nPut them into the next SS forge step.';if(q.includes('voidwalker')||q.includes('void crate'))return 'Spend Voidwalker crate x1 -> Voidwaker Sash if available.\n\nIf Sash is not available, pick Voidwaker Treads.\nTarget: SS Belt first, SS Boots second.';if(q.includes('xeno')||q.includes('pet')||q.includes('nutjob'))return 'Spend Xeno pet crystal x830 -> Nutjob.\nSpend Xeno pet elixir x1 -> Nutjob.\nAwakening crystals x22 -> only if Nutjob/Xeno next star finishes.';if(q.includes('gem'))return 'Gems: only spend on relic cores, selector cores, Xeno crystals, or guaranteed S/SS selector value.\nDo not spend gems on random pet/equipment chest spam.';if(q.includes('collect'))return 'Collectibles: spend toward Custom Collection Set 1 first, then sets 2/3/4 only when it completes a set bonus.';if(q.includes('full')||q.includes('all')||q.includes('plan')||q.includes('spend'))return fullPlan();return fullPlan()}function run(){const a=answer($('q').value);$('answer').textContent=a}$('ask').onclick=run;document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('q').value=b.dataset.q;run()});$('q').addEventListener('keydown',e=>{if(e.key==='Enter')run()});$('raw').value=JSON.stringify(PROFILE,null,2);$('answer').textContent='Ask the optimizer a question above.';</script></body></html>
