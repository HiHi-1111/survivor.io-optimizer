<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DTlgrind Optimizer</title><style>:root{color-scheme:dark;--bg:#07111f;--card:#101c2f;--card2:#17253b;--line:#2b4264;--txt:#edf5ff;--mut:#a8b7cc;--green:#6ee7a8;--yellow:#ffd166;--blue:#66aaff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17315a 0,#07111f 42rem);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:12px}h1{font-size:1.35rem;margin:6px 0 4px}h2{font-size:1.06rem;margin:0 0 10px}.card{background:rgba(16,28,47,.96);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}.big{font-size:1.03rem;line-height:1.35;color:#eaf3ff}.list{display:grid;gap:9px}.row{border:1px solid var(--line);background:#0b1628;border-radius:15px;padding:12px}.rank{color:var(--blue);font-weight:1000}.title{font-weight:1000;color:var(--green)}.mut{color:var(--mut);font-size:.9rem;margin-top:4px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:7px 9px;color:#d9e8ff;font-size:.86rem}button{width:100%;border:0;border-radius:14px;padding:12px;margin-top:8px;font-weight:900;background:linear-gradient(135deg,#4ea1ff,#7c5cff);color:white}input,textarea{width:100%;border:1px solid var(--line);border-radius:14px;background:#07111f;color:var(--txt);padding:12px}.small{font-size:.86rem;color:var(--mut)}@media(max-width:520px){.wrap{padding:10px}.card{padding:12px}}</style></head><body><main class="wrap"><section class="card"><h1>DTlgrind SIO-style optimizer</h1><p id="answer" class="big"></p><button id="copy">Copy spend plan</button></section><section class="card"><h2>Spend priority</h2><div id="plan" class="list"></div></section><section class="card"><h2>Build snapshot</h2><div id="build" class="chips"></div></section><section class="card"><h2>Inventory used</h2><div id="inv" class="chips"></div></section><section class="card"><h2>JSON</h2><input id="file" type="file" accept=".json,application/json"><p class="small">Built-in DTlgrind profile is loaded.</p><textarea id="raw" rows="6"></textarea><button id="paste">Analyze pasted JSON</button></section></main><script>const PROFILE={player:{name:'DTlgrind',level:138,gems:130539,coins:42500000,focus:'DPS only'},sio_stats:{total_atk:793156,base_atk:127352,final_atk:436568,available_designs:83500,max_gear_level:202,damage_shown:'142,912,460,712,309,100'},gear:{'SS Weapon':'3E/2V/2C','SS Necklace':'3E/3V/2C','SS Gloves':'3E/3V/2C','SS Chest':'1E/0V/0C','SS Belt':'1E/0V/0C','SS Boots':'1E/0V/0C'},inventory:{relic_core_chest:2,core_choice_chest:6,tech_core_choice_chest:40,s_grade_choice_pack:12,voidwalker_supply_crate:1,eternal_cores:240,void_cores:170,chaos_cores:120,relic_cores:45,xeno_pet_crystal:830,xeno_pet_elixir:1,awakening_crystals:22,pet_cookies:7436,base_tech_materials:189},recommendations:[{rank:1,title:'SS forge/core spending',spend:'core choice x6 + tech core choice x40 + relic chest x2 + relic cores x45',where:'SS forge core requirements first',advice:'Use this stash on low SS slots because Belt/Boots/Chest are only 1E/0V/0C.'},{rank:2,title:'Low SS slots',spend:'Eternal/Void/Chaos cores; S packs only if needed',where:'Belt first -> Boots -> Chest',advice:'Close the forge gap before side spending.'},{rank:3,title:'Xeno pet',spend:'xeno pet crystal x830 + xeno elixir x1',where:'Nutjob first',advice:'Do not spread Xeno resources across 1-star pets.'},{rank:4,title:'Collectibles',spend:'collectible resources',where:'Custom Collection Set 1 first; sets 2/3/4 only for set completion',advice:'Spend for set bonuses, not random loose stars.'},{rank:5,title:'Hold unless breakpoint',spend:'S packs, Voidwalker crate, awakening crystals',where:'Only if they finish SS forge or Nutjob/Xeno star',advice:'Keep flexible stuff until it completes a target.'}],site_answer:'Spend aggressively, but only into real DPS progress: SS forge/core stash first, low SS slots next, Nutjob Xeno resources next, collectibles by set bonus. Gems are secondary.'};const $=id=>document.getElementById(id),fmt=v=>typeof v==='number'?v.toLocaleString():v;function render(p){$('answer').textContent=p.site_answer||PROFILE.site_answer;$('raw').value=JSON.stringify(p,null,2);const inv=p.inventory||p.inventory_used||{};$('inv').innerHTML=Object.entries(inv).map(([k,v])=>`<span class="chip">${k.replaceAll('_',' ')}: <b>${fmt(v)}</b></span>`).join('');const gear=p.gear||{};$('build').innerHTML=Object.entries(gear).map(([k,v])=>`<span class="chip">${k}: <b>${v}</b></span>`).join('')+`<span class="chip">Final ATK: <b>${fmt(p.sio_stats?.final_atk||'')}</b></span>`;$('plan').innerHTML=(p.recommendations||[]).sort((a,b)=>a.rank-b.rank).map(x=>`<div class="row"><div><span class="rank">#${x.rank}</span> <span class="title">${x.title}</span></div><div class="mut"><b>Spend:</b> ${x.spend}</div><div class="mut"><b>Where:</b> ${x.where}</div><div class="mut"><b>Why:</b> ${x.advice}</div></div>`).join('')}document.getElementById('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{render(JSON.parse(await f.text()))}catch(err){alert('Bad JSON')}});$('paste').onclick=()=>{try{render(JSON.parse($('raw').value))}catch(err){alert('Bad JSON')}};$('copy').onclick=async()=>{const t=PROFILE.recommendations.map(x=>`#${x.rank} ${x.title}\nSpend: ${x.spend}\nWhere: ${x.where}\nWhy: ${x.advice}`).join('\n\n');try{await navigator.clipboard.writeText(t);alert('Copied')}catch(e){alert(t)}};render(PROFILE);</script></body></html>
