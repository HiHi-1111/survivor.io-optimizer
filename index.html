<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Damage Optimizer</title><style>body{margin:0;background:#07111f;color:#edf5ff;font-family:Arial,sans-serif}.wrap{max-width:1150px;margin:auto;padding:14px}.card{background:#101c2f;border:1px solid #2b4264;border-radius:18px;padding:14px;margin:12px 0}textarea{width:100%;background:#07111f;color:#edf5ff;border:1px solid #2b4264;border-radius:12px;padding:10px}.box{background:#0b1628;border:1px solid #2b4264;border-radius:14px;padding:12px;margin:9px 0}.green{color:#6ee7a8;font-weight:900}.yellow{color:#ffd166;font-weight:900}.red{color:#ff8a8a;font-weight:900}.blue{color:#88c7ff;font-weight:900}button{background:#4ea1ff;color:white;border:0;border-radius:12px;padding:10px;margin:5px 3px;font-weight:900}table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid #2b4264;padding:8px;text-align:left;vertical-align:top}th{background:#0b1628}.mini{font-size:.9rem;color:#a8b7cc}</style></head><body><main class="wrap"><section class="card"><h1>DTlgrind Damage Optimizer</h1><p class="yellow">This page now shows exactly what data was added, what your items can turn into, and what final E/V/C would be for each possible +1 upgrade. It will not force a best pick unless the JSON has damage score + cost requirements.</p><button onclick="runDefault()">Run DTlgrind parsed profile</button><button onclick="runPaste()">Run pasted JSON</button><textarea id="raw" rows="9"></textarea></section><section class="card"><h2>Optimizer Output</h2><div id="out"></div></section></main><script>const DEFAULT={player:{name:'DTlgrind',goal:'best_damage'},gear:{weapon:{type:'SS',E:3,V:2,C:2},necklace:{type:'SS',E:3,V:3,C:2},gloves:{type:'SS',E:3,V:3,C:2},chest:{type:'SS',E:1,V:0,C:0},belt:{type:'SS',E:1,V:0,C:0},boots:{type:'SS',E:1,V:0,C:0}},inventory:{core_chest:6,relic_core_chest:2,legend_collectible_and_resonance_chip_choice_chest:0,s_grade_excellent_choice_pack:12,voidwalker_supply_crate:1,tech_core_choice_chest:40,awakening_crystals:22,xeno_pet_crystal:830,xeno_pet_elixir:1,gems:130539,eternal_cores:240,void_cores:170,chaos_cores:120,relic_cores:45},choice_items:{core_chest:[{out:'Awakening Core',qty:1,affects:'awakening systems, not directly E/V/C'},{out:'Xeno Pet Core',qty:1,affects:'Xeno pet systems, not directly E/V/C'},{out:'Relic Core',qty:1,affects:'SS gear forge if next forge asks for relic cores'},{out:'Resonance Chip',qty:1,affects:'tech resonance if next resonance upgrade asks for chips'}],legend_collectible_and_resonance_chip_choice_chest:[{out:'Epic Quality Tech Choice Chest',qty:2,affects:'tech part progress'},{out:'Legend Collectible Choice Pack',qty:1,affects:'collectible/set bonus progress'},{out:'Resonance Chip',qty:1,affects:'tech resonance progress'}],relic_core_chest:[{out:'Relic Core',qty:1,affects:'SS gear forge if next forge asks for relic cores'},{out:'S-grade Excellent Choice Pack',qty:1,affects:'S equipment fodder/selector'}],s_grade_excellent_choice_pack:[{out:'Eternal equipment selector',affects:'E side or Eternal fodder for a selected slot'},{out:'Voidwaker equipment selector',affects:'V side or Voidwaker fodder for a selected slot'},{out:'Chaos equipment selector',affects:'C side or Chaos fodder for a selected slot'}],voidwalker_supply_crate:[{out:'Voidwaker equipment selector',affects:'V side or Voidwaker fodder for a selected slot'}],tech_core_choice_chest:[{out:'Eternal Tech Core',qty:1,affects:'tech core upgrade if screen asks for Eternal Tech Core'},{out:'Void Tech Core',qty:1,affects:'tech core upgrade if screen asks for Void Tech Core'},{out:'Chaos Tech Core',qty:1,affects:'tech core upgrade if screen asks for Chaos Tech Core'}]},damage_scores:null,cost_table:null};function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function evc(g){return (g?.E??0)+'E/'+(g?.V??0)+'V/'+(g?.C??0)+'C'}function clone(o){return JSON.parse(JSON.stringify(o))}function gearTable(gear){let h='<table><tr><th>Slot</th><th>Current</th><th>Possible final E/V/C if +1E</th><th>Possible final if +1V</th><th>Possible final if +1C</th></tr>';Object.keys(gear||{}).forEach(s=>{let g=gear[s],e=clone(g),v=clone(g),c=clone(g);e.E++;v.V++;c.C++;h+='<tr><td>'+esc(s)+'</td><td class=blue>'+esc(evc(g))+'</td><td>'+esc(evc(e))+'</td><td>'+esc(evc(v))+'</td><td>'+esc(evc(c))+'</td></tr>'});return h+'</table>'}function addedData(d){let inv=d.inventory||{},ch=d.choice_items||{},h='<div class=box><h3 class=green>What was added to the optimizer</h3><p>These are the consumable-choice facts now loaded. This is not a recommendation; it is the menu the optimizer can choose from.</p><table><tr><th>Owned item</th><th>You own</th><th>Possible outputs</th><th>What it can affect</th></tr>';Object.keys(ch).forEach(k=>{let owned=Number(inv[k]||0);let outs=ch[k].map(x=>(x.qty?x.qty+'x ':'')+x.out).join('<br>');let aff=ch[k].map(x=>x.affects||'unknown').join('<br>');h+='<tr><td>'+esc(k)+'</td><td>'+owned+'</td><td>'+outs+'</td><td>'+aff+'</td></tr>'});return h+'</table></div>'}function blockers(d){let hasScore=!!d.damage_scores, hasCost=!!d.cost_table;return '<div class=box><h3 class=yellow>Why it is not allowed to call a real best spend yet</h3><p>The optimizer has your inventory and item menus, but it still needs the two things below to avoid fake advice.</p><table><tr><th>Needed data</th><th>Status</th><th>What to send</th></tr><tr><td>Cost table / forge requirement screen</td><td class='+(hasCost?'green':'red')+'>'+(hasCost?'loaded':'missing')+'</td><td>Screenshot of next upgrade screen for each SS slot/tech/pet where it shows exact required items.</td></tr><tr><td>Damage score for each candidate</td><td class='+(hasScore?'green':'red')+'>'+(hasScore?'loaded':'missing')+'</td><td>SIO before/after damage, or a table saying how much damage +1E/+1V/+1C gives per slot.</td></tr></table><p class=yellow>Without these, any “best” answer would be made up. The optimizer can still show exactly what each item can become and every possible final E/V/C.</p></div>'}function neutralCandidates(d){let gear=d.gear||{},h='<div class=box><h3>Every possible final E/V/C candidate from your current gear</h3><table><tr><th>Upgrade candidate</th><th>Before</th><th>After</th><th>Can optimizer spend for it now?</th><th>Why</th></tr>';Object.keys(gear).forEach(slot=>['E','V','C'].forEach(side=>{let g=gear[slot],after=clone(g);after[side]++;let can='No';let why='needs exact cost + damage value for '+slot+' '+side;h+='<tr><td>'+esc(slot+' +1'+side)+'</td><td>'+esc(evc(g))+'</td><td class=blue>'+esc(evc(after))+'</td><td class=red>'+can+'</td><td>'+esc(why)+'</td></tr>'}));return h+'</table></div>'}function exactIfDataLoaded(d){if(!d.cost_table||!d.damage_scores)return '<div class=box><h3 class=yellow>Best spend result</h3><p>No final spend order yet because cost_table or damage_scores are missing. This is the correct non-biased answer.</p><p>Once those are loaded, this section will say exact lines like: ITEM xN -> PICK Y -> SLOT becomes 2E/1V/0C -> damage score gain Z.</p></div>';return '<div class=box><h3 class=green>Best spend result</h3><p>Cost and damage tables loaded. Ranking not implemented in this minimal page yet.</p></div>'}function optimize(d){return addedData(d)+'<div class=box><h3>Current equipment parsed from your profile</h3>'+gearTable(d.gear||{})+'</div>'+neutralCandidates(d)+blockers(d)+exactIfDataLoaded(d)}function run(d){document.getElementById('out').innerHTML=optimize(d);document.getElementById('raw').value=JSON.stringify(d,null,2)}function runDefault(){run(DEFAULT)}function runPaste(){try{run(JSON.parse(document.getElementById('raw').value))}catch(e){document.getElementById('out').innerHTML='<div class=box>Bad JSON: '+esc(e.message)+'</div>'}}runDefault();</script></main></body></html>
