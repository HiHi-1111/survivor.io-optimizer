<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Survivor.io Spend Optimizer</title><style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101c2f;--panel2:#17253b;--text:#edf5ff;--muted:#a8b7cc;--good:#6ee7a8;--warn:#ffd166;--line:#263a59;--blue:#66aaff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at top,#17315a 0,var(--bg) 42rem);color:var(--text)}.wrap{max-width:960px;margin:0 auto;padding:14px}h1{font-size:1.55rem;margin:4px 0 8px}h2{font-size:1.08rem;margin:0 0 10px}.card{background:rgba(16,28,47,.95);border:1px solid var(--line);border-radius:18px;padding:15px;margin:13px 0;box-shadow:0 10px 30px #0005}.hero{border-color:#3569a6;background:linear-gradient(135deg,#234a7a88,#7c5cff22)}p{color:var(--muted);line-height:1.45}.answer{color:#e8f2ff;font-size:1.05rem}.row{display:flex;flex-wrap:wrap;gap:8px}.pill,.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 10px;color:var(--muted)}.pill b{color:var(--text)}button{border:0;border-radius:14px;padding:12px 14px;font-weight:900;background:linear-gradient(135deg,#4ea1ff,#7c5cff);color:white}button.secondary{background:#263a59}input,textarea{width:100%;border:1px solid var(--line);border-radius:14px;background:#07111f;color:var(--text);padding:12px}input{border-style:dashed}.plan{display:grid;gap:12px}.rec{border:1px solid var(--line);border-radius:16px;background:#0c1728;padding:14px}.top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.rank{font-size:1.2rem;font-weight:1000;color:var(--blue);margin-right:8px}.title{font-size:1.05rem;font-weight:1000}.status{font-weight:1000;border-radius:999px;padding:6px 9px;font-size:.82rem;white-space:nowrap}.spend{background:#6ee7a829;color:var(--good);border:1px solid #6ee7a859}.save{background:#ffd16629;color:var(--warn);border:1px solid #ffd16659}.cond{background:#66aaff29;color:#9cc8ff;border:1px solid #66aaff59}.kv{display:grid;grid-template-columns:104px 1fr;gap:7px 10px;margin-top:10px}.k{color:#9eb0c8;font-weight:800}.v{color:#f0f6ff}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chip{font-size:.88rem;color:#d3e4ff}.small{font-size:.9rem}.foot{font-size:.82rem;color:#88a0be;margin:20px 0}@media(max-width:560px){.wrap{padding:11px}h1{font-size:1.35rem}.card{padding:13px}.top{display:block}.status{display:inline-block;margin-top:8px}.kv{grid-template-columns:1fr}.k{margin-top:4px}button{width:100%}}
</style></head><body><main class="wrap">
<section class="card hero"><h1>Survivor.io Spend Optimizer</h1><p id="quick" class="answer"></p><div class="row"><button id="load">Reload DTlgrind fixed plan</button><button class="secondary" id="copy">Copy plan</button></div></section>
<section class="card"><h2>1) Upload JSON</h2><input id="file" type="file" accept=".json,application/json"><p class="small">This now reads your exact <code>direct_spend_plan</code>. If the file does not have one, it uses the fixed DTlgrind plan.</p></section>
<section class="card"><h2>2) Parsed profile</h2><div id="summary" class="row"></div></section>
<section class="card"><h2>3) What to spend on</h2><div id="recs" class="plan"></div></section>
<section class="card"><h2>4) JSON</h2><textarea id="raw" rows="8"></textarea><div class="row"><button id="paste">Analyze pasted JSON</button></div></section><div class="foot">Temporary mobile UI. Nothing is uploaded anywhere; the optimizer runs in your browser.</div></main>
<script>
const BUILT={schema_version:'survivor_optimizer_player_snapshot_v2',player:{name:'DTlgrind',level:138,focus:'DPS only / kill-before-killed',ignore_hp_for_optimization:true,damage_output:142912460712309100,total_atk:793156,base_atk:127352,final_atk:436568,available_designs:83500,max_gear_level:202},stats:{damage_output:142912460712309100,total_atk:793156,base_atk:127352,final_atk:436568},resources:{gems:130539,coins:42500000,ss_relic_cores:45,relic_cores:45,relic_core_choice_chest:2,core_choice_chest:6,tech_core_choice_chest:40,s_grade_excellent_equipment_choice_pack:12,voidwalker_excellent_equipment_supply_crate:1,eternal_cores:20,chaos_cores:10,extra_awakening_crystals:22,ss_material_a:240,ss_material_b:170,ss_material_c:120},gear_priority:{current_build:'Advanced SS DPS build. Weapon, necklace, and gloves are already high-forged. Chest, belt, and boots are the lower-forged SS slots.',next_ss_priority_order:['SS Belt','SS Boots','SS Chest'],selector_rule:'Open selectors only when the forge screen shows the exact missing type.'},tech:{drone_mode:900,rocket_mode:900,soccer_mode:550,lightning_mode:960,laser_mode:1260,molotov_mode:600,normal_molotov:2100},pets:{main_pet:'Nutjob',sync_rate_pct:85,main_pet_awakened_stars_estimate:4},quick_answer:'Spend tech core choice chests into Soccer Mode first. Then push SS Belt forge using exact selectors only if needed. After that, spend awakening crystals only if Nutjob/Xeno reaches the next star now. Save S-grade packs unless they finish that SS forge step.',direct_spend_plan:[{rank:1,title:'Spend tech core choice chests into Soccer Mode first',status:'SPEND NOW',resource_to_use:['tech_core_choice_chest x40'],target:'Soccer Mode / Soccer Twinborn resonance until the next cheap breakpoint, then rerun SIO.',why:'Your tech resonance is uneven and Soccer Mode is one of the lowest at 550. Your SIO comparison showed Soccer as the visible positive swap (+3.82%), so this is the cleanest spend that does not burn relic/core selectors.',stop_condition:'After each breakpoint, rerun/reload SIO. If Soccer stops being positive, stop and move remaining tech cores to the next active DPS tech SIO ranks highest: Drone, Rocket, Laser, or Lightning.',confidence:'High for first spend direction; medium for exact final amount until exact breakpoint costs are added.'},{rank:2,title:'Push SS Belt next, then SS Boots, then SS Chest',status:'SPEND IF FORGE SCREEN ALLOWS',resource_to_use:['ss_relic_cores x45','relic_core_choice_chest x2 only if needed','core_choice_chest x6 only for exact missing core type','eternal_cores x20 / chaos_cores x10 only if exact requirement'],target:'Next affordable Astral/SS forge breakpoint on SS Belt first. If not affordable, try SS Boots. If not, try SS Chest.',why:'Your weapon, necklace, and gloves already look like the high-forge damage core. Belt is the best lower-forge damage slot to push next. Chest is last because this optimizer ignores HP/survival.',stop_condition:'Do not open all selectors in advance. Open only enough to complete the shown forge step. If the step cannot be completed now, save unopened selectors.',confidence:'Medium-high.'},{rank:3,title:'Use awakening crystals only if Nutjob/Xeno reaches next star now',status:'CONDITIONAL SPEND',resource_to_use:['extra_awakening_crystals x22'],target:'Nutjob/Xeno next star/stat breakpoint, not random normal pets.',why:'Your build is already Nutjob/Xeno based with 85% sync and 4-star visible awakening power. Awakening crystals are good only when they complete a real stat/star breakpoint.',stop_condition:'If 22 crystals do not unlock the next star/stat, save them. Do not spend gems on normal pet chests unless the event gives guaranteed Xeno crystals better than direct selector value.',confidence:'Medium.'},{rank:4,title:'Keep S-grade packs as exact SS fodder',status:'SAVE UNLESS THEY COMPLETE RANK #2',resource_to_use:['S-grade excellent equipment choice pack x12','Voidwalker excellent equipment supply crate x1'],target:'Open only the exact S equipment needed to finish SS Belt, Boots, or Chest forge/core conversion.',why:'These packs are flexible stored value. Randomly opening them before the forge screen asks for a specific piece can trap the wrong faction/piece.',stop_condition:'If no exact SS forge step is available, keep all packs closed.',confidence:'High.'},{rank:5,title:'Spend gems only on guaranteed breakpoint materials',status:'EVENT-DEPENDENT',resource_to_use:['gems x130,539'],target:'Relic cores, tech core selectors, Xeno crystals, or guaranteed S/SS selectors. Avoid random normal pet/equipment chest spam.',why:'At your account level, random chests are normally worse than guaranteed materials that finish one of the top three plans.',stop_condition:'If the event shop cannot buy one of those materials at good value, save gems.',confidence:'High.'}]};
const $=id=>document.getElementById(id),num=v=>typeof v==='number'?v:Number(String(v??'').replace(/[^0-9.-]/g,''))||0,fmt=v=>num(v).toLocaleString();
function get(o,paths,f='?'){for(const p of paths){const v=p.split('.').reduce((a,k)=>a&&a[k]!==undefined?a[k]:undefined,o);if(v!==undefined&&v!==null&&v!=='')return v}return f}
function res(p){const r=Object.assign({},p.resources||{},p.inventory||{},p.bag||{});if(r.ss_relic_cores&&!r.relic_cores)r.relic_cores=r.ss_relic_cores;if(p.player?.gems&&!r.gems)r.gems=p.player.gems;return r}
function cls(s){s=String(s).toUpperCase();if(s.includes('SPEND NOW'))return'spend';if(s.includes('SAVE'))return'save';if(s.includes('CONDITIONAL')||s.includes('EVENT')||s.includes('ALLOWS'))return'cond';return'cond'}
function fallback(p){const r=res(p);return BUILT.direct_spend_plan.map(x=>JSON.parse(JSON.stringify(x))).map(x=>{if(x.rank==1)x.resource_to_use=[`tech_core_choice_chest x${num(r.tech_core_choice_chest)||40}`];if(x.rank==2)x.resource_to_use=[`relic cores x${num(r.relic_cores||r.ss_relic_cores)}`,`relic core chests x${num(r.relic_core_choice_chest)}`,`core choice chests x${num(r.core_choice_chest)}`];if(x.rank==3)x.resource_to_use=[`awakening crystals x${num(r.extra_awakening_crystals||r.awakening_crystals)}`];return x})}
function render(p){const r=res(p);$('quick').textContent=p.quick_answer||BUILT.quick_answer;$('raw').value=JSON.stringify(p,null,2);const chips=[['Name',get(p,['player.name','name','player.display_name'])],['Level',get(p,['player.level','level','player.level_visible'])],['Total ATK',get(p,['stats.total_atk','player.total_atk','total_atk'])],['Final ATK',get(p,['stats.final_atk','player.final_atk','final_atk'])],['Gems',r.gems??'?'],['Relic cores',r.relic_cores??r.ss_relic_cores??'?'],['Relic core chests',r.relic_core_choice_chest??'?'],['Tech core chests',r.tech_core_choice_chest??'?'],['Awakening crystals',r.extra_awakening_crystals??r.awakening_crystals??'?']];$('summary').innerHTML=chips.map(([k,v])=>`<span class="pill">${k}: <b>${typeof v==='number'?fmt(v):v}</b></span>`).join('');const plan=(p.direct_spend_plan&&p.direct_spend_plan.length?p.direct_spend_plan:fallback(p)).sort((a,b)=>num(a.rank)-num(b.rank));$('recs').innerHTML=plan.map(x=>`<article class="rec"><div class="top"><div><span class="rank">#${x.rank}</span><span class="title">${x.title}</span></div><span class="status ${cls(x.status)}">${x.status}</span></div><div class="chips">${(x.resource_to_use||[]).map(y=>`<span class="chip">${y}</span>`).join('')}</div><div class="kv"><div class="k">Target</div><div class="v">${x.target||''}</div><div class="k">Why</div><div class="v">${x.why||''}</div><div class="k">Stop/save</div><div class="v">${x.stop_condition||''}</div><div class="k">Confidence</div><div class="v">${x.confidence||''}</div></div></article>`).join('')}
$('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{render(JSON.parse(await f.text()))}catch(err){alert('Bad JSON: '+err.message)}});$('paste').onclick=()=>{try{render(JSON.parse($('raw').value))}catch(err){alert('Bad JSON: '+err.message)}};$('load').onclick=()=>render(BUILT);$('copy').onclick=async()=>{const t=BUILT.direct_spend_plan.map(x=>`#${x.rank} ${x.title} - ${x.status}\nUse: ${(x.resource_to_use||[]).join(', ')}\nTarget: ${x.target}\nWhy: ${x.why}\nStop: ${x.stop_condition}`).join('\n\n');try{await navigator.clipboard.writeText(t);alert('Copied')}catch(e){alert(t)}};render(BUILT);
</script></body></html>
