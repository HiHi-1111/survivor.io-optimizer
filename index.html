<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DTlgrind Exact Spend</title><style>:root{color-scheme:dark;--bg:#07111f;--card:#101c2f;--line:#2b4264;--txt:#edf5ff;--mut:#a8b7cc;--green:#6ee7a8;--yellow:#ffd166;--blue:#66aaff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17315a 0,#07111f 42rem);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:12px}h1{font-size:1.35rem;margin:6px 0 4px}h2{font-size:1.05rem;margin:0 0 10px}.card{background:rgba(16,28,47,.96);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}.big{font-size:1.02rem;line-height:1.35}.list{display:grid;gap:9px}.row{border:1px solid var(--line);background:#0b1628;border-radius:15px;padding:12px}.rank{color:var(--blue);font-weight:1000}.pick{font-weight:1000;color:var(--green);font-size:1.02rem}.mut{color:var(--mut);font-size:.9rem;margin-top:4px}.save .pick{color:var(--yellow)}button{width:100%;border:0;border-radius:14px;padding:12px;margin-top:8px;font-weight:900;background:linear-gradient(135deg,#4ea1ff,#7c5cff);color:white}textarea{width:100%;border:1px solid var(--line);border-radius:14px;background:#07111f;color:var(--txt);padding:12px}.small{font-size:.86rem;color:var(--mut)}</style></head><body><main class="wrap"><section class="card"><h1>DTlgrind exact spend targets</h1><p class="big">Clear item allocation. Not categories.</p><button id="copy">Copy exact plan</button></section><section class="card"><h2>SPEND THESE</h2><div id="plan" class="list"></div></section><section class="card"><h2>SAVE / ONLY IF NEEDED</h2><div id="save" class="list"></div></section><section class="card"><h2>JSON</h2><textarea id="raw" rows="8"></textarea></section></main><script>const PROFILE={exact_spend_targets:[{rank:1,item:'S-grade excellent equipment choice pack',amount:2,pick:'Eternal Suit / Eternal chest piece',put_into:'SS Chest E-side progress'},{rank:2,item:'S-grade excellent equipment choice pack',amount:2,pick:'Voidwaker Sash / Void belt piece',put_into:'SS Belt V-side progress'},{rank:3,item:'S-grade excellent equipment choice pack',amount:2,pick:'Voidwaker Treads / Void boots piece',put_into:'SS Boots V-side progress'},{rank:4,item:'Voidwalker excellent equipment supply crate',amount:1,pick:'Voidwaker Sash if available; otherwise Voidwaker Treads',put_into:'SS Belt first, SS Boots second'},{rank:5,item:'Core choice chest',amount:6,pick:'Void cores',put_into:'SS Belt/Boots V-side core needs'},{rank:6,item:'Relic core chest',amount:2,pick:'Relic cores',put_into:'next SS forge step'},{rank:7,item:'Tech core choice chest',amount:40,pick:'Void tech cores / Void-type core choice',put_into:'Twinborn/tech core requirement, not Lightning/Soccer/Laser'},{rank:8,item:'Xeno pet crystal',amount:830,pick:'Nutjob',put_into:'Nutjob only'},{rank:9,item:'Xeno pet elixir',amount:1,pick:'Nutjob',put_into:'Nutjob only'},{rank:10,item:'Awakening crystals',amount:22,pick:'Nutjob/Xeno only if next star completes',put_into:'save if no star completes'}],save_targets:['Remaining S-grade packs after the 6 listed above','Gems unless buying relic cores / selector cores / Xeno crystals / guaranteed S or SS selector value','Random pet chests','Random equipment chests']};const $=id=>document.getElementById(id);function render(){ $('raw').value=JSON.stringify(PROFILE,null,2); $('plan').innerHTML=PROFILE.exact_spend_targets.map(x=>`<div class="row"><div><span class="rank">#${x.rank}</span> ${x.item} x${x.amount}</div><div class="pick">Pick: ${x.pick}</div><div class="mut">Where: ${x.put_into}</div></div>`).join(''); $('save').innerHTML=PROFILE.save_targets.map(x=>`<div class="row save"><div class="pick">${x}</div></div>`).join('')} $('copy').onclick=async()=>{const t=PROFILE.exact_spend_targets.map(x=>`#${x.rank} ${x.item} x${x.amount} -> ${x.pick} -> ${x.put_into}`).join('\n')+'\n\nSAVE\n'+PROFILE.save_targets.join('\n');try{await navigator.clipboard.writeText(t);alert('Copied')}catch(e){alert(t)}};render();</script></body></html>
