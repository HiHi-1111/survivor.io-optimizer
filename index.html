<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DTlgrind Spend</title><style>:root{color-scheme:dark;--bg:#07111f;--card:#101c2f;--card2:#17253b;--line:#2b4264;--txt:#edf5ff;--mut:#a8b7cc;--green:#6ee7a8;--yellow:#ffd166}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17315a 0,#07111f 42rem);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:680px;margin:auto;padding:12px}h1{font-size:1.35rem;margin:6px 0 4px}h2{font-size:1.08rem;margin:0 0 10px}.card{background:rgba(16,28,47,.96);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}.big{font-size:1.03rem;line-height:1.35;color:#eaf3ff}.list{display:grid;gap:9px}.row{border:1px solid var(--line);background:#0b1628;border-radius:15px;padding:12px}.label{font-weight:1000}.spend .label{color:var(--green)}.save .label{color:var(--yellow)}.mut{color:var(--mut);font-size:.9rem;margin-top:2px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:7px 9px;color:#d9e8ff;font-size:.88rem}button{width:100%;border:0;border-radius:14px;padding:12px;margin-top:8px;font-weight:900;background:linear-gradient(135deg,#4ea1ff,#7c5cff);color:white}input,textarea{width:100%;border:1px solid var(--line);border-radius:14px;background:#07111f;color:var(--txt);padding:12px}.small{font-size:.86rem;color:var(--mut)}@media(max-width:520px){.wrap{padding:10px}.card{padding:12px}}</style></head><body><main class="wrap"><section class="card"><h1>DTlgrind Spend / Save</h1><p id="answer" class="big"></p><button id="copy">Copy</button></section><section class="card"><h2>SPEND ON</h2><div id="spend" class="list"></div></section><section class="card"><h2>SAVE</h2><div id="save" class="list"></div></section><section class="card"><h2>Inventory</h2><div id="inv" class="chips"></div></section><section class="card"><h2>JSON</h2><input id="file" type="file" accept=".json,application/json"><p class="small">Optional. Built-in bag info is already loaded.</p><textarea id="raw" rows="5"></textarea><button id="paste">Analyze pasted JSON</button></section></main><script>const BUILT={player:{name:'DTlgrind',level:138,focus:'DPS only'},inventory_used:{gems:130539,relic_core_chest:2,core_choice_chest:6,tech_core_choice_chest:40,s_grade_choice_pack:12,voidwalker_supply_crate:1,eternal_cores:20,chaos_cores:10,awakening_crystals:22},spend_now:['Core choice chests x6 -> Void cores','Relic core chests x2 -> SS gear relic cores','Tech core choice chests x40 -> Lightning Mode','Gems -> relic cores / tech selectors / Xeno crystals only'],save:['S-grade choice packs x12','Voidwalker supply crate x1','Awakening crystals x22 unless Nutjob/Xeno star completes','Random pet/equipment chests'],site_answer:'SPEND: Core choice -> Void cores. Relic chest -> SS relic cores. Tech core -> Lightning Mode. Gems -> relic/tech/Xeno selectors. SAVE: S packs, Void crate, random chests, awakening unless Xeno/Nutjob star finishes.'};const $=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString();function render(p){const inv=p.inventory_used||p.resources||BUILT.inventory_used;const spend=p.spend_now||BUILT.spend_now;const save=p.save||BUILT.save;$('answer').textContent=p.site_answer||BUILT.site_answer;$('raw').value=JSON.stringify(p,null,2);$('inv').innerHTML=Object.entries(inv).map(([k,v])=>`<span class="chip">${k.replaceAll('_',' ')}: <b>${typeof v==='number'?fmt(v):v}</b></span>`).join('');$('spend').innerHTML=spend.map(x=>`<div class="row spend"><div class="label">${x}</div></div>`).join('');$('save').innerHTML=save.map(x=>`<div class="row save"><div class="label">${x}</div></div>`).join('')}document.getElementById('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{render(JSON.parse(await f.text()))}catch(err){alert('Bad JSON')}});$('paste').onclick=()=>{try{render(JSON.parse($('raw').value))}catch(err){alert('Bad JSON')}};$('copy').onclick=async()=>{const t='SPEND ON\n'+BUILT.spend_now.join('\n')+'\n\nSAVE\n'+BUILT.save.join('\n');try{await navigator.clipboard.writeText(t);alert('Copied')}catch(e){alert(t)}};render(BUILT);</script></body></html>
