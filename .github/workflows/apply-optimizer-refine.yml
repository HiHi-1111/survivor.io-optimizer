name: Apply optimizer refinement

on:
  push:
    branches:
      - optimizer-heavy-refine-20260718

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify and extract reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .optimizer-refine/payload.part* > /tmp/optimizer-refine.b64
          base64 --decode /tmp/optimizer-refine.b64 > /tmp/optimizer-refine.tar.gz
          echo "20b2670c6380578d25f89b75327e542d26a987d6c8441ba261fc58163dfbcd94  /tmp/optimizer-refine.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/optimizer-refine.tar.gz
          cat .optimizer-refine/compat.part* > /tmp/optimizer-refine-compat.b64
          base64 --decode /tmp/optimizer-refine-compat.b64 > /tmp/optimizer-refine-compat.tar.gz
          echo "b1e05f8106e8dea326bc64213ba08d8f2716907984716d96671b195aafaa7d69  /tmp/optimizer-refine-compat.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/optimizer-refine-compat.tar.gz
          python - <<'PY'
          from pathlib import Path

          path = Path("optimizer/global_planner.py")
          text = path.read_text(encoding="utf-8")
          old = '''    best_first_action_id = str((best.get("actions") or [{}])[0].get("action_id", ""))
              proposal_budget_false_prune = int(bool(budget_audit_action_ids and best_first_action_id not in budget_audit_action_ids))
          '''
          new = '''    best_actions = best.get("actions") or []
              best_first_action_id = str(best_actions[0].get("action_id", "")) if best_actions else ""
              # The mandatory no-spend baseline is not generated by the proposal budget,
              # so it cannot be a budget false prune. Only a real winning action can be missed.
              proposal_budget_false_prune = int(bool(
                  best_actions and budget_audit_action_ids and best_first_action_id not in budget_audit_action_ids
              ))
          '''
          if old not in text:
              raise SystemExit("final proposal-budget audit block was not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile changed modules
        run: |
          python -m py_compile \
            optimizer/action_types.py \
            optimizer/player_state.py \
            optimizer/state_transition.py \
            optimizer/state_hash.py \
            optimizer/state_value.py \
            optimizer/action_generators/mounts.py \
            optimizer/mount_component_solver.py \
            optimizer/action_registry.py \
            optimizer/proposal_budget.py \
            optimizer/coverage.py \
            optimizer/global_planner.py \
            optimizer/main.py \
            optimizer/scorer.py \
            optimizer/source_pack_optimizer.py \
            optimizer/training_cache.py

      - name: Trace proposal-budget false prune
        run: |
          python - <<'PY'
          from optimizer.action_registry import generate_inventory_actions
          from optimizer.global_planner import plan_global_inventory
          from optimizer.player_state import PlayerState

          knowledge = {
              "metadata": {"schema_version": "1.0"},
              "items": [{
                  "id": "red_collectible_chest", "name": "Red Collectible Choice Chest",
                  "category": "chest", "rarity": "red", "selector": True,
                  "contents": ["collectible_shard"], "source_refs": ["t"], "confidence": "high",
              }],
              "pets": [{"id": "pet_a", "name": "Pet A", "rarity": "epic", "source_refs": ["t"], "confidence": "high"}],
              "pet_awakenings": [{"id": "pet_a_aw1", "name": "Pet A Awakening 1", "pet_id": "pet_a", "stars": 1, "crystals_required": 1, "source_refs": ["t"], "confidence": "high"}],
              "xeno_pets": [{"id": "xeno_alpha", "name": "Xeno Alpha", "effects": [{"type": "damage_pct", "value": 18}], "source_refs": ["t"], "confidence": "high"}],
              "collectibles": [{"id": "collectible_a", "name": "Collectible A", "target_item_id": "item_a", "rarity": "red", "shards_per_star": 100, "max_stars": 5, "effects": [{"type": "damage_pct", "value": 5}], "source_refs": ["t"], "confidence": "high"}],
          }
          state = PlayerState(
              inventory={"items": {"collectible_shard": 1000}, "selector_chests": {"epic_pet_chest": 1}},
              resources={"xeno_core": 1, "red_collectible_chest": 1},
          )
          common = dict(
              systems=None, include_saves=True, include_random_ev=False,
              include_missing_placeholders=False, use_cache=False,
              scoreable_only=True, total_proposal_budget=24,
          )
          all_actions = generate_inventory_actions(state, knowledge, proposal_budget=False, **common)
          budgeted = generate_inventory_actions(state, knowledge, proposal_budget=True, **common)
          result = plan_global_inventory(
              state, knowledge, chain_depth=3, beam_size=2, gpu_preprune=False,
              preprune_audit=True, proposal_budget_enabled=True, total_proposal_budget=24,
          )
          print("TRACE_ALL_COUNT", len(all_actions))
          print("TRACE_BUDGET_COUNT", len(budgeted))
          print("TRACE_BUDGET_IDS", [row.get("action_id") for row in budgeted])
          print("TRACE_BEST_STEPS", [row.get("action_id") for row in result["best_action_chain"]["ordered_steps"]])
          print("TRACE_MISSED", result["metrics"]["proposal_budget_missed_action"])
          missed = result["metrics"]["proposal_budget_missed_action"]
          for row in all_actions:
              if row.get("action_id") == missed:
                  print("TRACE_MISSED_ROW", row)
          PY

      - name: Run focused and compatibility tests
        run: |
          pytest -q \
            tests/test_optimizer_refine_mounts.py \
            tests/test_global_planner_exact_baseline.py \
            tests/test_player_state.py \
            tests/test_state_hash.py \
            tests/test_global_planner.py \
            tests/test_source_pack_optimizer.py \
            tests/test_action_graph.py \
            tests/test_adversarial_optimizer_features.py

      - name: Commit verified refinement
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .optimizer-refine
          rm -f .github/workflows/apply-optimizer-refine.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refine exact optimizer logic and add mount planning"
          git push origin HEAD:optimizer-heavy-refine-20260718
