name: sIO CE exact and champion lineage

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-ce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile exact optimizer modules
        run: >-
          python -m compileall -q
          optimizer/player_state.py
          optimizer/sio_ce_account.py
          optimizer/sio_runtime_oracle.py
          optimizer/sio_item_pipeline.py
          optimizer/sio_exact_actions.py
          optimizer/sio_tech_progression.py
          optimizer/champion_lineage.py
          optimizer/exact_training_labels.py
          optimizer/sio_calibration.py
          tools/sio_training/audit_sio_runtime_coverage.py
          tools/sio_training/train_champion_lineage.py
      - name: Validate offline oracle JavaScript
        run: node --check tools/sio_runtime/sio_ce_oracle.js
      - name: Audit sIO formula, uptime, registry and cleanup coverage
        shell: bash
        run: |
          set +e
          python tools/sio_training/audit_sio_runtime_coverage.py \
            --output sio-runtime-audit-${{ matrix.python-version }}.json \
            2>&1 | tee sio-runtime-audit-${{ matrix.python-version }}.log
          code=${PIPESTATUS[0]}
          exit "$code"
      - name: Run focused exact CE and lineage suite
        shell: bash
        run: |
          set +e
          python tools/run_sio_ce_tests.py 2>&1 | tee pytest-focused-${{ matrix.python-version }}.log
          code=${PIPESTATUS[0]}
          exit "$code"
      - name: Run complete repository suite
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          set +e
          python -m pytest -q 2>&1 | tee pytest-full-${{ matrix.python-version }}.log
          code=${PIPESTATUS[0]}
          exit "$code"
      - name: Run inherited champion lineage smoke
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/sio-lineage-smoke
          set +e
          python tools/sio_training/train_champion_lineage.py \
            --dataset tests/fixtures/exact_lineage_labels.json \
            --lineage-root /tmp/sio-lineage-smoke \
            --generations 2 \
            --children 2 \
            --epochs 3 \
            --report /tmp/sio-lineage-smoke/report.json \
            2>&1 | tee lineage-smoke-${{ matrix.python-version }}.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/sio-lineage-smoke')
          registry = json.loads((root / 'registry.json').read_text())
          assert registry['current_champion_id']
          assert registry['hall_of_fame']
          assert registry['children']
          child = json.loads(next((root / 'children').glob('*.json')).read_text())
          assert child['primary_parent_id']
          assert any(abs(float(value)) > 1e-12 for value in child['inherited_weights'])
          assert (root / 'report.json').is_file()
          PY
      - name: Upload validation logs and exact runtime snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-ce-py${{ matrix.python-version }}
          path: |
            *.log
            sio-runtime-audit-*.json
            tools/sio_runtime/sio_ce_oracle.js
            optimizer/sio_runtime_oracle.py
            optimizer/sio_ce_account.py
            optimizer/sio_item_pipeline.py
            knowledge/sio_runtime_manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify lineage CLI
        if: always()
        run: python tools/sio_training/train_champion_lineage.py --help
