name: Run DTlgrind Cloud Optimizer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run-dtlgrind-cloud.yml"
      - "app/browser_runner.py"
      - "optimizer/**"
      - "profiles/dtlgrind.json"
      - "tools/run_dtlgrind_cloud.py"
      - "requirements.txt"

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out optimizer
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run exact DTlgrind optimizer
        run: python tools/run_dtlgrind_cloud.py

      - name: Save mobile report in repository
        if: always()
        run: |
          mkdir -p docs/dtlgrind
          if [ -f site/index.html ]; then cp site/index.html docs/dtlgrind/index.html; fi
          if [ -f site/result.json ]; then cp site/result.json docs/dtlgrind/result.json; fi
          if [ -f training_outputs/browser_jobs/dtlgrind_latest.json ]; then cp training_outputs/browser_jobs/dtlgrind_latest.json docs/dtlgrind/checkpoint.json; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dtlgrind
          git diff --cached --quiet || git commit -m "Update DTlgrind optimizer report"
          git push origin HEAD:main

      - name: Upload full optimizer result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtlgrind-optimizer-result
          path: |
            site/
            training_outputs/browser_jobs/dtlgrind_latest.json
          if-no-files-found: warn
          retention-days: 30
