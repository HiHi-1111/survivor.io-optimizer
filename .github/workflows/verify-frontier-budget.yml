name: Verify frontier-aware budget

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Extract reviewed optimizer code
        shell: bash
        run: |
          set -euo pipefail
          cat .optimizer-refine/payload.part* | base64 --decode > /tmp/base.tar.gz
          echo "20b2670c6380578d25f89b75327e542d26a987d6c8441ba261fc58163dfbcd94  /tmp/base.tar.gz" | sha256sum -c -
          tar -xzf /tmp/base.tar.gz
          cat .optimizer-refine/compat.part* | base64 --decode > /tmp/compat.tar.gz
          echo "b1e05f8106e8dea326bc64213ba08d8f2716907984716d96671b195aafaa7d69  /tmp/compat.tar.gz" | sha256sum -c -
          tar -xzf /tmp/compat.tar.gz
          cat .optimizer-refine/frontier.part* | base64 --decode > /tmp/frontier.tar.gz
          echo "4443f15f4e9779fc6672d77879f6e56a06e402a14de4bbf5d581003f65dc3ec5  /tmp/frontier.tar.gz" | sha256sum -c -
          tar -xzf /tmp/frontier.tar.gz
          python - <<'PY'
          from pathlib import Path
          path = Path("optimizer/global_planner.py")
          text = path.read_text(encoding="utf-8")
          old = '''    best_first_action_id = str((best.get("actions") or [{}])[0].get("action_id", ""))
              proposal_budget_false_prune = int(bool(budget_audit_action_ids and best_first_action_id not in budget_audit_action_ids))
          '''
          new = '''    best_actions = best.get("actions") or []
              best_first_action_id = str(best_actions[0].get("action_id", "")) if best_actions else ""
              # The mandatory no-spend baseline is not generated by the proposal budget,
              # so it cannot be a budget false prune. Only a real winning action can be missed.
              proposal_budget_false_prune = int(bool(
                  best_actions and budget_audit_action_ids and best_first_action_id not in budget_audit_action_ids
              ))
          '''
          if old not in text:
              raise SystemExit("final proposal-budget audit block was not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile changed modules
        run: |
          python -m py_compile \
            optimizer/action_types.py optimizer/player_state.py optimizer/state_transition.py \
            optimizer/state_hash.py optimizer/state_value.py optimizer/action_generators/mounts.py \
            optimizer/mount_component_solver.py optimizer/action_registry.py optimizer/proposal_budget.py \
            optimizer/coverage.py optimizer/global_planner.py optimizer/main.py optimizer/scorer.py \
            optimizer/source_pack_optimizer.py optimizer/training_cache.py
      - name: Run optimizer compatibility suite
        run: |
          pytest -q \
            tests/test_optimizer_refine_mounts.py \
            tests/test_global_planner_exact_baseline.py \
            tests/test_player_state.py \
            tests/test_state_hash.py \
            tests/test_global_planner.py \
            tests/test_source_pack_optimizer.py \
            tests/test_action_graph.py \
            tests/test_adversarial_optimizer_features.py
